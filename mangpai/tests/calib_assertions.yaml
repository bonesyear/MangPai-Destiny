# calib 金标准断言 — 郝金阳《命理珍宝》10例 × 46项
# 金标准来源: 《命理珍宝》郝金阳原断 (mangpai/docs/duan-books/mingli-zhenbao-50qi.txt)
# 矩阵来源: docs/layer3-haojin-yang-audit-20260713.md (36项) + 层功level 10项(郝断富贵程度)
# runner: mangpai/tests/calib_assertions.py (--write-baseline 按行改写 baseline，保留本注释)
# 注意: items 必须保持单行 flow 风格 (- {dim: ..., gold: {...}, baseline: X})，且 note 内
#       禁止半角逗号 (flow mapping 分隔符)，用全角，代替。
meta:
  baseline_date: '2026-07-17'
  baseline_counts: {✅: 28, ⚠️: 10, ❌: 8}
  rubric: |
    财命 direction: 破财=summary含凶向标记(破财/比劫夺财/坐牢/牢狱/官非/下浮封顶)或tier=贫 -> ✅,
      小康 -> ⚠️, 富/巨富无凶向 -> ❌; 凶(因财致祸)=有凶向标记 ✅, tier=贫 ⚠️, 否则 ❌;
      正向(贫/小康/富/巨富)=tier等级差0 ✅ 差1 ⚠️ 差>=2 ❌, 有凶向标记直接 ❌,
      magnitude_absurd_if 命中富档则 ✅ 降 ⚠️。
      P0-a 断语性质选轨: 破财/凶 且案例锚定运岁(流年事件) -> 评 tier/summary(含岁运delta);
      其余(层级断语+未锚定运岁的破财/凶) -> 评 tier_static/summary_static(原局轨)。
    官命 direction: is_guanming 不符 ❌; 符 ✅; gold.level 差1 ⚠️ 差>=2 ❌;
      industry_contains 未命中主行业/summary 则 ✅ 降 ⚠️。
    应期 commit: conclusion 以「应期成立/真应期成立」开头=commit; 与 gold.commit 一致 ✅ 否则 ❌。
    层功 level: gold.level 精确(差0 ✅ 差1 ⚠️ 差>=2 ❌) 或 level_min/level_max 区间
      (区间内 ✅ 出界1档 ⚠️ >=2档 ❌)。
    婚姻: quality 差/平/好 等级差0 ✅ 差1 ⚠️ 差2 ❌; gold.duohun 不符再降一档。
    职业: primary 命中 primary_in ✅; 命中 partial_in ⚠️; 空且 allow_empty ✅; 空 ⚠️; 其余 ❌。
      （M2 增补：allow_empty 与 unemployed 桶同义——「允许空」即金标准认可无正当职业，命中亦 ✅）
    子息: has_zixi 与 gold 一致 ✅ 否则 ❌。
    回归定义: 判定比 baseline 差(✅->⚠️/❌, ⚠️->❌)即回归, runner 退出码 1。

cases:
  - id: zhenbao-01
    name: 第1期·生孩子/官司/职业
    gans: [戊, 己, 乙, 丁]
    zhis: [戌, 未, 巳, 亥]
    gender: 男
    year: 1958
    dayun: [壬, 戌]
    liunian: [戊, 辰, 1988]
    items:
      - {dim: 财命, gold: {direction: 破财, note: 戊辰年破财/不宜投资}, baseline: ❌}
      - {dim: 官命, gold: {is_guanming: false, note: 普通人有官司}, baseline: ✅}
      - {dim: 婚姻, gold: {quality: 平, duohun: false, note: 有妻有子}, baseline: ❌}
      - {dim: 职业, gold: {partial_in: [merchant], note: 烧窑/不正当生意(个体经营)}, baseline: ⚠️}
      - {dim: 应期, gold: {commit: true, note: 戊辰年应}, baseline: ✅}
      - {dim: 子息, gold: {has_zixi: true, note: 有子+怀胎}, baseline: ❌}
      - {dim: 层功, gold: {level_max: 2, note: 普通个体+破财}, baseline: ⚠️}

