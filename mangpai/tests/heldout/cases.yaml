  source: shouke-li263:7200;zhenbao-qi06:193
  raw_quote: "l、某书法家，乾造：    庚庚庚乙\n\n                      子辰午酉\n\n问：伤官制官为何不是当官的？\n\n答：午入主，子水入宾。子辰合（内含戊癸合）被绊，制不过来。到申运三合局到宾位，也\n\
    \n不制午火。于水是单纯的泄秀。如反过来变成庚午年庚子日，则可断为官。\n\n2、某市市长： 丁壬壬辛\n\n              丑子申亥\n\n问：财虚透被制为何不是大企业家？\n\n答：财星入宾位被比禄制之，表示为官掌有财权，而不是他自己的财，再说虚透之财主才华\n\
    \n，不主财富。"
