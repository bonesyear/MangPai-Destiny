  raw_quote: "例2：乾造：辛    乙    壬   辛\n\n            巳    未    戌   亥\n\n此为曾红极一时的民营企业家牟其中造，庚辰年以信用诈骗罪判刑。其八字结构也是一个骗子。其一：印星虚透日主弱；其二：财星支藏而旺。他的用神是水木，木有制官杀的作用，行己丑运刑起官杀，必遭官灾。"
