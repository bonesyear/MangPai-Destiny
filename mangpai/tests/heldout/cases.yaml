    婚姻: 差·一辈子不如意离婚与人同居
  source: shouke-qi41:1936
  raw_quote: "4、坤造：丙庚乙甲\n\n                   午戌卯申\n\n           此女有钱，长得好。但一看就是婚姻不好，但命贵，不是贱女人，婚姻一辈子不如意，离婚与人同居。\n\n       \
    \    禄绊为桃花，禄在时向内合不属于卖淫，但其桃花是必犯的，会与熟人相好；向外合则易犯淫，易出贱命。以上所讲俱是禄逢六合，禄见三合局时也会犯桃花，只是程度要轻。命中无合，大运遇合是，在此大运中犯桃花。禄不入主逢合不为桃花。"
