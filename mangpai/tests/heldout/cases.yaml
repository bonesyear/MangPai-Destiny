    职业: 农民·无赖讹诈
    应期: 癸酉运后五年贩卖假银元收入大好/辛未运谎称跟狐狸精坐家中得人供养/壬申运穷得过不下去折腾儿子们要钱
  source: shouke-ans11:2520;zhenbao-qi11:367
  raw_quote: "乾造：甲丙丙甲\n\n                  子寅寅午\n\n      大运：丁戊己庚辛壬癸甲\n\n                  卯辰已午未申西戌\n\n      此造实际为贱命，农民，不爱劳动，无赖，常讹诈别人钱财。丙火最怕木旺助火，必火势冲天。年支水被水吸干，无法制火；最忌午时，劫财得势为小人猖狐，诀日：“枭神生劫不劳而获”，一生靠劫取他人财为生，没有自尊自爱，若生于巴时见禄，则有了自尊心，虽自私自利不能言贵，也不会贱一到这个程度。\n\
    \n      中年行一路南方火地，无财可劫，贫困度日。辛末运合绊忌神；又浮财可得，他为躲避“学大\n\n寨”劳动，谎称自己跟了个狐狸精，坐在家中别人传俸。壬申运冲击忌神袅，劈木生火，穷得过不下去就折腾儿了们要钱。癸酉运后五年好转，见财则可劫得，贩卖假银元，收入大好。于虎应老师《雷》集中一神造：\n\
    \n        甲丁丙甲\n\n        寅卯寅午\n\n    靠绊大款为生，也为个劳而获。\n\n                          第十二期作业答案\n\n      阎锡山：       癸辛乙丁\n\n\
    \                     未酉酉丑"
- id: shouke-ans12-下岗财会
  name: ans12-下岗财会
  bazi:
    year: 丁未
    month: 壬子
    day: 丁巳
    hour: 辛丑
  liunian: 庚辰
  gender: 女
  verdicts:
    职业: 财会·管理账务
    财命: 小康·96年起收入丰厚庚辰年买房
    应期: 甲戌年下岗/丙子年起得财/庚辰年买房
  source: shouke-ans12:2560;zhenbao-qi13:468
  raw_quote: "坤造：      丁壬丁辛\n\n                 未子巳丑\n\n      大运：      癸甲乙丙\n\n                  丑寅卯辰\n\n      此造的实际情况中：高中毕业，工作分配一般，94年下岗，95年在家休息，丈大也下岗，生\n\
    \n活十分困难。96年重新找下工作，开始赚钱，因为她的职业是管理账务，乘职务之便能捞外块，故96、 9 7、 9 8、 9 9年俱有丰厚的收入。庚辰年乙庚合，财星合印，花10万元买了一套房子，而在之前一直是租房子住。\n\n     \
    \ 她的情况正好与赵宇流年情况相反，可实际上他们的用神是一样的。之所以有如此大的差别，就是流年与大运，八字作用的结果不同。通过对这个命的研究，会对学员的命理水平提高一个层次。\n\n      首先为何她没有高的学历，赵宇有。因八字时上财星得了根，而印星没有，辛亥时财星无根，印临长生。身弱时作忌宜财弱不受生，主富有，财旺有生扶则主贫。但此造命局虽不贵不富，却行用神地，乙卯运扶起日主主吉。甲戌年卯戍合，太岁绊卯不生日主，卯为印为工作，丢了工作，此年千万不要理解成卯戌合化火助日主，六合以合为主，化是极其微弱的。如果断成癸酉年酉冲去卯下岗也正确，实际癸酉年就停发了工资。乙亥年成亥卯未局，本丁可生助日主，实际生不成，因未处在“宾”的位置，亥卯未之局是助了年干之丁火，与日主无关，故此年依然闲在家中，相反会因为亥冲已的缘故，丈夫也下了岗。丙子年，丙辛合，子丑合，太岁合绊时上两忌神，去忌神时得忌神，故得财。而赵宇是行己酉大运忌神临旺，丙辛之合不能去辛，反有合动之忌。丁丑年赚钱的道理与赵宇一样，戊寅年寅刑巳，刑动喜神生吉；而赵宇这一年贪合亥水而一事无成。己卯年用神到位之年，生助火也吉。"
- id: shouke-ans12-下岗穷命
  name: qi14-下岗穷命
  bazi:
    year: 庚戌
    month: 庚辰
    day: 戊辰
    hour: 壬戌
  gender: 男
  verdicts:
    财命: 贫·下岗后一直找不到工作很穷
    职业: 无业·下岗
  source: shouke-ans12:4076;zhenbao-qi14:513
  raw_quote: "1、乾造：庚庚戊壬\n\n                                  戌辰辰戌\n\n                为何此造会穷？\n\n                回答这个问题要应用到十神意向原理。庚金食神本为八字的秀气，若局中无壬水此为食神泄秀\
    \ 格，为才干超群之社会精英人物。然局中有壬水，食神去生财，食神之意向发生变化，不再表示才华。能力，而是欲赚钱的想法和手段。坏就坏在此造财星太弱，财根被破，故成想赚钱又得不到钱，所以就穷了。运行癸末运财最哀绝，故无财。"
- id: shouke-ans12-靠绊大款
  name: ans12-靠绊大款
  bazi:
    year: 甲寅
    month: 丁卯
    day: 丙寅
    hour: 甲午
  gender: 女
  verdicts:
    财命: 平·靠绊大款为生不劳而获
  source: shouke-ans12:4084;zhenbao-qi14:519
  raw_quote: "2、坤造：甲丁丙甲\n\n                                  寅卯寅午\n\n                为何此造不属于贱人？\n\n                有的学员认为是月令正印的缘故，实际她的偏印贴身，正印时她的影响不大。此造与：\n\
    \n                  甲丙丙甲\n\n                 子寅寅午\n\n                两例比较，甲子造时羊刃为大忌神，也为小人恶人之意，此羊刃为日主自己的秉性；而甲寅造虽时逢羊刃却同时透丁，丁是午的原身，说明羊刃的那种恶人性格不是她本人的，而是别人的，她只不过是与这些恶人坏人伍而已，自己并不坏。也就是说此八字一透丁火，午火之属性发生变化。"
- id: shouke-ans15-银行董事长
  name: ans15-银行董事长
  bazi:
