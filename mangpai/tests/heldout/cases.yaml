  raw_quote: "作业，坤造：癸戊己戊\n\n                酉午巳辰\n\n    行癸亥运丁巳年大发，戊午年又大破财。取用神并解释得财与破财的原因，并说出此造丁已年是如何得财的（选择：A、生意；B、赠予；C、博彩）。\n\
    \n    答：选C，博彩。此造是从强格以财作忌神，八字先天是以癸水财作忌神，又戊癸合，表示她得财为方式是通过劫取，不劳而获的财。博彩与赌博都属于这一种。\n\n    行癸亥运为忌神运，这一大运整体来讲并好，因原局中忌神并未彻底制服（癸水之根辰土未被制）。所以此运做小生意为生。到丁已年与大运相冲，是冲走亥水，去忌得忌，故发了大财；到戊午年，又将冲去的水合了回来（午亥暗合）。故破大财。\n\
    \n                                第三十四期作业答案"
