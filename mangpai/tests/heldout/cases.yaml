  raw_quote: '????乾造：己??乙??丁??庚

    ??????????丑??亥??巳??戌

    说此人一生爱沾花惹草，寻花问柳，他不清楚为什么，要我指点。我让周围几个易友分析，一说是正偏财混杂的原因。我说正偏财混杂代表二婚或有婚外情，并不代表好嫖，理由不对；又说是时上伤官的原因。我说伤官好色者是指放任了日主，又生了财，此造伤官正好是日主的墓库，不放任日主，再说戌为燥土，不生财，理由不对。我提供自己的分析：进制

    “五行金木水火土，火主人的色欲和性欲，有句成语叫欲火烧身，不是没有道理。况此造巳火是劫财，劫财者搞女人之意。巳亥一冲不是灭了火，而是激起火性，又临门户之库戌主歌厅等色情场所，盖头庚财为招牌，即以女人为招牌的色情聚集之所，所以他会出没于各种色情之所，好嫖。”易友大都赞同我的观点。

    第二天，小王拿来一个八字，说我的理是对的，有一歌厅小姐可证：'
