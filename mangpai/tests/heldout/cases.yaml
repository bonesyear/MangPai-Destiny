  raw_quote: "乾：  甲戊己丁        吴佩孚\n\n          戌辰酉卯\n\n    酉食为寿元星，食神空亡主寿短，时卯冲酉主晚年有凶灾，非正常死亡，辰酉合延寿，死于乙亥运己卯年，酉在运中为病地，亥生卯杀，卯冲酉寿元星而亡，卯辰穿倒，死在亥月亥日，因亥泄酉食寿元星（与原书中讲的不一样）。\n\
    \n    壬申运乙卯年升旅长，1920年丁巳年升师长，癸酉运的庚申年升为直系首领。癸酉运的辛酉年遇刺而未险。\n\n甲子年打败仗，丁卯年打败仗，乙亥运己卯年被日本人害死了（《合指》P211，以酉为用，以酉食制卯杀，成食神制杀X（19－1），巳午未运酉金受制，申运而能制卯杀大吉，用神在运中到位，忌神一出现而被制，伤官合杀掌兵权，杀在门户，门户为国外，他与外国人斗，宁死不投降，壬申运庚申年顶峰，癸酉运用神带自刑，甲子年酉临死地，子财泄食之气。\n\
    \n    流年冲大运为冲走，此造如果没有卯酉冲而只有辰酉，则酉辰用神将会被合坏。\n\n    例235"
