  raw_quote: "例：乾造：癸  丙  己  乙\n\n             卯  辰  丑  亥\n\n   行癸丑大运辛未流年，这一年开始作生意赚钱，以前一直是穷光蛋。 到丙子年合墓，生意关门。\n\n   何谓冲出？专指两种情形。１、流年冲年支、冲时支谓冲出，一般应出门，因年为祖，表示离祖，时为门户，表示外出。当然这只是一种出门信息，未必所有人都会出门。２、用神或忌神入墓，逢流年冲用神或忌神时谓冲出，被冲出之神会影响命局或发生该神代表的事情。\n\
    \n   例；丙  乙  辛  丁\n\n       戌  未  丑  酉\n\n   此造１９岁甲辰年行丁酉运出门找到工作，因辰戌冲年主离祖，辰酉合禄主有了饭碗。\n\n   例：丁  壬  丁  辛\n\n       未  子\
    \  巳  亥\n\n   行庚戌运用神巳火入墓于戌，癸亥年冲出巳火，考中高中，而在壬戌年却落榜。\n\n   何谓冲去？一般太岁冲八字中衰神谓冲去，冲去专指此神离开命主，而不主死亡。如配偶离异、兄弟离家、父母离异弃养等。\n\n  \
    \ 何谓冲破？太岁冲八字中极衰受克之神谓冲破，被冲破之神毫无生机，或无原神或原神被坏，或逢大运、八字克害、或孤弱无依。被冲破之神主大凶，兆其死亡。"
