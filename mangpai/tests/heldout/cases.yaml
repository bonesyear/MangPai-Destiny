  raw_quote: "乾：丁丙壬乙\n\n            亥午申巳\n\n       此造身弱财多，丁壬合，丁财合入日主，为日主第一妻子；月建丙财与时上巳禄是一个人，丙财坐午是日主的第二个妻子，第二个妻子比第一个妻力大。年上丁亥为一家人，丁为亥禄之妻，丙为情人，与女秘书同居，与妻子离婚。\n\
    \n       关于戌土与己土见辰戌丑末的关系。\n\n       戊见辰戌与禄已，己见丑末与禄午，是同一个人，此称原身。\n\n       禄就是身体，亦是寿元星。\n\n       若看女孩子破身，禄被冲穿破则为破身。\n\n\
    \        例21"
