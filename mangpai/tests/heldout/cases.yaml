  source: shouke-qi50:2262
  raw_quote: "5、坤造：乙己丁庚\n\n                 卯丑丑戌\n\n        此造为从儿格，用神是庚金，卯木为忌神，虽月令不见官印，年上之卯印也作工作单位看。行至壬辰运，辰穿倒卯木，会离职。因官杀之库穿印，可断是因丈夫的原因而失去工作，实际是结婚后，夫较有钱，她的工作工资很低，不让她会上班了。\n\
    \n        以年月之官印看原工作，以时上的官印看后找的工作；如时上无官印，则多从事自谋职业或自由职业。时上见用神，必定离职后转好。"
