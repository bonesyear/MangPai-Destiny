    day: 甲戌
    hour: 己巳
  dayun: 壬午
  liunian: 辛未
  gender: 男
  verdicts:
    官命: 是·行政升职
    职业: 文秘→行政
    应期: 壬午运辛未年升职/辛巳运丙子年再升/庚辰年因别人的事牵涉翻旧账与钱有关很麻烦立秋后更严重
  source: shouke-ans05:2336;zhenbao-qi02:164
  raw_quote: "乾造：乙 丙 甲 己\n\n       酉 戌 戌 已\n\n                大运：8乙18甲28癸38壬48辛\n\n                       酉   申   末   午  \
    \  已\n\n                此造行壬午运的辛未年升职，行辛巳运的丙子年升职。我当时断：“以前你从事文字工作，90 年或91年开始搞行政，96年提拔。今年因别人的事牵涉到你，是翻旧帐的事，与钱有关，很麻烦，立秋后会臾严重。”\n\
    \n                此造食神去官成格，用神是火，火主文字、写作或绘画，他在八十年代中后期一直搞文秘。伏宫在八岁速干之年升官，辛末年宫易正透，被丙火合去，主升；到辛巳运它在大运透干，即可断被八岁合去或克去之流年升职，丙子年无疑。今年庚辰，七杀忌神被年劫财合人命中，主个好的事由别人引起。辰成冲，旧事重提，冲财与财有关，立秋甲申月合杀被冲，又杀星得禄最厉害。他说我断得对，但未告诉我具体什么事。\n\
    \n                伤它去官格不论日主衰旺。其实许多八字都不管身弱身强，看身弱身强只是初学者的一个拐杖。 我主张要逐步废弃看身强弱，才能跨入命学的高境界。"
- id: shouke-ans05-保卫科长升副处长
  name: ans05-保卫科长升副处长
  bazi:
    year: 甲辰
    month: 癸酉
    day: 庚辰
    hour: 壬午
  dayun: 丙子
  liunian: 乙亥
  gender: 男
  verdicts:
    官命: 是·副处长
    职业: 官员·医院保卫科长调入某厅
    应期: 乙亥年升副处长/98-99年扶贫工作队任队长/庚辰年机构改革平调不升
  source: shouke-ans05:2350;zhenbao-qi02:169
  raw_quote: "乾造：甲癸庚壬\n\n                            辰酉辰午\n\n                此造丙子运的乙亥流年为重大转折。有学员答为壬申年或癸酉年，这两年的情况我个不清楚，但 不是转折年，只能是不错不流年。乙亥年从一个医院保卫科的科长调入某厅升为副处长这一年文化厅一副厅长生病住院，在住院期间搭上关系，极尽阿谀奉承之能事，副厅长出院后即提调他。\
    \ 98－9 9年在我参加的扶贫工作队1队长，在这一年的工作中，对他恶劣的品行可谓耳闻目睹。此造之俗，因辰士混水之故。金水伤它主聪明秀气，和砷虽为贪官，但金水纯清小杂七，聪明绝顶，才华横溢（历史上的和神与电视剧中的和砷不同，要没有过人的才华，怎么可以得到才智双全的乾\
    \ 隆爷的赏识？）。一混湿土变成一理烂泥巴，俗不可耐。吹牛说谎是因为伤食混杂又地支无根之故。食神主言语，混伤宫即话语不着边际，口不把关；水又虚浮支无强根，便主言而无信，吹牛说谎。但有一点他与和申是一致的，说是会拍马屁，奉迎上司，此因食神下面落宫星又暗合，不就表示用言语哄着上\
    \ 司团团转，拍人马屁吗？\n\n                此命转折可以断成乙亥年或丙子年，此两年都是去官流年，但仔细分析还应在乙亥年，因此年乙庚合，六岁之喜是合人命主，全喜事临身。不要把大岁干支分开来看，要连在一块，就好比一个人的头\
    \ 与脚一样，喜神之亥因人于乙的引动与八字发生吉的作用，不必等到丙子年。后此人大运入丁丑，略差于丙子。原想着下乡完后能升个处级，不料逢机构改革，人员精减，庚辰年并没有八字所喜的水出现，故又平调而不升。我看此运最多升个正处级，还防寅运被查办。（后记，仇南全先生在《易友园地》发表义章，提到一个命与此命一模一样，乙亥年升副乡长。它\
    \ 的级别高低可能与出生的地方有关，但从权力来讲，一个好乡的副乡长并不比一个普通的副处长差。）\n\n                                    第六期作业答案"
