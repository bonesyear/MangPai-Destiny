  raw_quote: "例3、坤造：已甲癸甲\n\n                    亥戍已寅\n\n         此女到现在己有五次婚姻。第一、二任丈夭死亡，第三任离异，第四、五任是同居一段后都走了。\n\n         \
    \ 命中伤食重克官星，伤官寅木穿夫宫，亥（中含伤官）冲夫宫，甲与寅同性，故几重伤官看几次婚姻， 数得四重伤官。然命中还有两重官杀，故看婚姻次数是四加二得六。断六次婚姻应该准确。\n\n         两重甲木伤官克己土，故己土代表的两次婚姻，俱死亡：戍上受甲克，两甲，亥又长生甲，第三次婚姻，俱离异（戌中有原神克不死，故为离）：巳中戊士得正位，又得伤官生而不克，可断第六次婚姻是自己的正大，可保平安。\n\
    \n         作业：看此命有几次婚姻"
