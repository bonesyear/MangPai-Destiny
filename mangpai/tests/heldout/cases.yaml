    应期: 戊辰年妻得病/丙子丁丑年妻又重病继母死
  source: shouke-ans29:4278
  raw_quote: "乾造：癸丙戊丙           说性格与贵贱。\n\n                末辰戍辰\n\n              接到学员的答案，成明认为：喜用神为水木。性格暴躁，经济情况不会不好，有多少花多少，社会地位不高，为普通的体力劳动者。\n\
    \n              建平认为：此造戊生辰月土薄湿气重，当取两火暖局帮身为用，它行火士运。此造袅神生劫为不劳而获之人，且柱中不见禄当是为无尊严之人；应为贱命，性格强蛮，唯利是图，为人小器。 他们俩答得都对，很奇怪用神却取的不一样。这个人懒隋又无耻，吃了上顿不顾下顿，有钱花了今天不管明天，一贫如洗，与正常人不太一样。\n\
    \n              我起初认为此造用神是火而不是水木。后来成明再次来信探讨这个问题，我请教提供此命的王一中先生，他讲了此造的详细情况并发表了自己的观点，最后的结论是用神是木，成明的较正确。\n\n             \
    \ 为什么用神是木呢？因为他属于土重而顽，我以前说的土虚看来不对。因水得两库而不能从，以身 旺劫印为忌神看。八字水不能耗其士的旺性，水又弱，也无法用：又因水弱被制无原神所以会穷。\n\n              其经历简述如下：\n\n\
    \              出生四天后丧母，但少年时过的并不差，可以说是一生最好的时候。他有个好姨妈，从小对他十分的爱，也得其他长辈的爱（那时行乙卯用神地）。自从结婚独立后说开始差了（寅运会长生丙火忌神），还死了长子。主要是他懒到极点又自私到极点，据说一生连一千元也没赚过。他有个好姐姐，为他找下工作后没干几天就不干了（月令辰为姐，中含用神木）。他有一儿两女，女儿对他都十分孝（时上辰士主女，中含木为用神），给他买的衣服与吃的都不会过夜就得穿上或吃掉，而且是只顾自己不顾别人，且六亲不认，不懂得去爱别人（这与袅神与身旺有关）。\n\
    \n              他凡见辰戌丑末年都不好。戊辰年妻得病，家里几乎不能过了。丙子丁丑年妻又重病，继母死。恐怕入庚戌运更差。\n\n                                    第三十期作业答案"
- id: shouke-ans30-从禄格有钱
  name: ans30-从禄格有钱
  bazi:
    year: 丁未
    month: 壬寅
    day: 己巳
    hour: 庚午
  gender: 女
  verdicts:
    财命: 富·丙子丁丑年赚钱最多
    应期: 丙子丁丑得财/戊寅年被人骗
  source: shouke-ans30:4300
  raw_quote: "作业：坤造：丁壬己庚\n\n                                      未寅巳午\n\n              大运：癸甲乙丙\n\n                      \
    \    卯辰巳午\n\n            答：此造实际的经历是，壬申癸酉年俱不错，乙亥年也赚钱，但丙子、丁丑年赚钱最多。戊寅年被人骗，至庚辰年未见起色。很明显此造是从禄格，以壬水与庚金为忌神。丙子年是忌神财星得根被去（子午冲，冲去子），去财得财；丁丑年是忌神庚金得根被去（丑未冲去丑，又丁火合去壬水财星为应期），也得财。如果说用神是午火禄神，那戊寅年生助禄神该好，为何会破财？有学员答为戊土劫财为忌神，所以破财。实际上八字与大运俱无劫，流年劫财是不会分禄的。回答这个问题必须从原命局入手。\n\
    \n              已土是一种田园之土，虽然从旺以火作用神，从原局来讲却不喜火过旺，过旺则土被烧焦而变质， 故这类命局必须有病神才能富贵。如蒋介石：丁亥、庚戌、己已、庚午，有庚金与亥水为病神；而别外\n\n一造：丁未、庚戍、己已、庚午，则过愈焦燥，己土变质，禄神牛火反成了忌神，所以贱。本造之所以有钱是因为有壬水财为病神，况生子寅月，已上末焦。行巳、丙、及丁运是属喜神大运，因原局喜神旺而忌神弱又被制化，最宜忌神出现被制流年，不宜化喜为忌流年。\n\
    \n    戊寅年，戊土泄丙火而生康金，化喜为忌，本来这一年寅木生午为喜，只生火而个去财，生火等于无用，故破财。已卯年已士也泄丙火生庚金，到庚辰年辰上也泄午火生庚金，故三年不吉。辛已年用神到位，又去辛金忌神，会得财。\n\n     \
    \                     第三十一期作业答案"
