  raw_quote: "乾造：乙戊乙壬\n\n                    未子卯午\n\n              此造是银行行长。岳父是高官，他是沾岳父的光爬上去的。如何看出？此造以印星子水为忌神，未财制之，命中用神是未，财星本作父看，但人“应”位，故为岳父。\n\
    \n              作业：请大家说说为何此造子水这忌神？\n\n              答：此造乙木冬生本应火为调候，但又见了不生卯反破卯，故作忌神。好在未穿之，去印得官，故为官。"
