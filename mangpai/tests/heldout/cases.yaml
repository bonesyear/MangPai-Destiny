  raw_quote: "16、乾造  公路局长：丙壬乙乙\n\n                    申辰巳酉\n\n问；怎么断是当它的？为何酉是此八字的核心？己卯年冲运酉为何会升？\n\n答：此造为印为用，伤官本为忌。但伤官合杀等于伤官能制服忌神，可当用神看。故酉\n\
    \n起关键的作用。伤官合杀杀有制是当官的命。己卯年冲杀为应期，杀被绊，冲之则动，等于是自己手中握的权柄（杀）在此年发挥作用了。"
