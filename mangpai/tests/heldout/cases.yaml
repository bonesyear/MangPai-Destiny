  raw_quote: "乾：丙癸己丙\n\n        申巳卯子\n\n    原局中先天七杀有化。乙未运任公职，癸亥年因犯事被开除公职，杀印相生自化能任公职，可乙未运，七杀透于，癸亥年亥卯未合成杀局，又巳亥冲，巳印被冲破而使印杀不能自化被开除。原局已申合财，合绊财之原神，财为忌，去财去伤官能得财。丙申运申到位，做地产生意很有钱。\n\
    \n    此造有双妻，丙申运，有机会再找了一个，癸水子水为一个，但原神申中有壬妻，为二妻之命。丁酉运坏了，酉金无制了。\n\n     例 129"
