    应期: 辛亥运节节提升/庚戌运很差曾烧锅炉
  source: shouke-qi35:1530
  raw_quote: "另一个与之相似的八字，乾造：壬戊庚丁\n\n                                        寅申辰亥\n\n                                 9岁起大运：己庚辛壬\n\
    \n                                             酉戌亥子\n\n          此造与上造都属于食神为用官杀为忌被吉的结构，但这个八字有财星也被去，多了财的病神就是一位与财相关联的官了。虽然也是处级，但他是某厅下属一家贸易公司的经理。庚戌运很差，还烧过锅炉，到辛亥运则节节提升。有人会问庚戌运辰戌冲，是忌神火根被去吉才对，为何不好？实际上这个理是不成立的，在原局中丁火忌神是被壬水去的，不是要辰土去，再说大运见的是戌土，是硬土，只有戌冲坏辰（客冲主）的可能，没有辰冲坏戌的可能问（不能主冲客，在这里又小是反客为主应期的情况）。故戌运差。"
- id: shouke-qi35-肾炎住院
