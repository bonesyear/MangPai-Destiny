  raw_quote: "17、坤造：丁庚乙辛\n\n          巳戌巳巳\n\n问：伤官旺为何还被男人强奸而不是滥交男人？怎么断辛亥运己巳年是被父辈强奸？\n\n答：伤官是官杀的长生，伤官与官不是对立的，故无法将官杀制服，反而易招男人。官\n\
    \n杀邻身又合是难以逃避的。己巳年己土生官杀，已为财为父。原局中戍士为父，庚金也为父，\n\n今庚与辛同党都是忌神，欺辱她。"
