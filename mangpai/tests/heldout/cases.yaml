  raw_quote: "8、坤造：壬辛丙丁\n\n         戌亥子酉\n\n  问：能否详细分析此三陪女的表意象？\n\n  答：此女不为从格，因见丁羊刃有根而不从。劫合杀，是用劫的手段搞男人：劫下坐财\n\n其目的不言而喻。"
