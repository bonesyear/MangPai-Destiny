  raw_quote: "乾造：戊壬丁丁\n\n                辰戌丑未\n\n               6癸16甲26乙36丙46丁56戊66己\n\n                亥   子   丑   寅   卯\
    \   辰    已\n\n          经历：生子庙中。甲子运甲申年旱灾加瘟疫全家死光。无奈出家，后去游乞讨三年。至戊子年回皇觉寺。\n\n          甲子运最后一年壬辰，投红巾军，娶郭子兴干女儿马氏为妻，升总兵。\n\n\
    \          乙丑运初，癸已年自募军队，礼贤下士，组成自己打天下的班底。\n\n          丙申年攻下金陵，称关国公。庚子年又大败陈友亮。\n\n          壬寅年，奸邵荣之女，邵荣叛，险被那杀。此年部将判逃甚众。\n\
    \n          癸卯年，丙寅运初。大败陈反亮，将其杀死。称吴王。\n\n          乙己年攻下张士诚。戊申年正月登基。\n\n          辛亥年全国统一。\n\n          己己运丁丑年（一说是壬申年，正行戊辰运），太子死；其于戊寅年死亡。全部嫔妃殉葬。"
- id: shouke-qi49-安全局
  name: qi49-安全局
  bazi:
    year: 戊戌
    month: 己未
    day: 辛卯
    hour: 辛卯
  dayun: 甲戌
  gender: 男
  verdicts:
    官命: 是·去印得官
    职业: 官员·当兵转政府秘书入安全局
    应期: 93年提职/98年调升
  source: shouke-qi49:2198
  raw_quote: "乾造：戊己辛辛\n\n                 戌未卯卯\n\n           大运：庆辛壬癸甲\n\n                 申酉戌亥子\n\n           我断：你是个很能干的人，早年当兵，后从事文字或文化工作，但一种职业干不长，要换两种职业。94甲戌或95乙亥年提升，98戊寅或99己卯年提升。今后六月有一次调动的机会，但你不一定会。\n\
    \n           他说：“其他都对，只是我93年提升的。先当兵，88年入政府作秘书，93年提职，98年又调升入安全局。今年的六月让我下地区当局长，我没去。”\n\n          初看此造应是个有钱的老板，因八字官星既非用也非忌，而财星火主为用，似乎是以求财为主，但命理妙在识其要害。此造财无原神，是不会去发财的，那印为忌受财制，印主文，必是搞文的，财的意向不主钱，而主本事、能力，印又表示权力，故是去印得官的命。戌运忌神印到位主升职，两卯合制，待流年冲其合为应期，故应癸酉年升（如一卯合制，必不应冲，两合有争之意，应冲一留一）。"
