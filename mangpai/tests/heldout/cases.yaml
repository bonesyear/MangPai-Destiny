    应期: 丙子年被扣破财
  source: shouke-li263:7410
  raw_quote: "21、乾造：庚壬丙丙\n\n          寅午戌申\n\n问：因参加走私被海关查获，人被扣，破财几十万元人才被取保。为何是走私命？且为\n\n何是96年被扣破财？\n\n答：从强，劫比及戌士为用，财官为病。其命的目的是取财，不象前两造一样是与法律\n\
    \n对抗。但财中含杀，是公家这时，又是用劫的手段，故取财必是违法的。命中杀星高透，头上悬着一把创。行丁亥运丁壬能合绊官，寅亥能合官，此运中必能与官方周旋得开，然逢丙子年丙壬相冲，丁壬不能合绊，故被抓。然又丙能克壬之原神庚，等于是花钱以减壬杀之力。明克为明花钱，放为取保。"
