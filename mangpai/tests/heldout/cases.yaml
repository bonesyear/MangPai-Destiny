  source: shouke-qi37:1654
  raw_quote: "袁世凯：己癸丁丁\n\n                 末酉巳未\n\n          丁火得势而有金水之病。\n\n          梁启超：癸甲丙癸\n\n                  酉寅午已\n\
    \n          丙火得势而有金水之病。\n\n          普金：壬己丙甲\n\n                辰酉戌午\n\n          丙火得势而有金水之病，辰酉合，病神自去。行甲寅运得权。\n\n    \
    \      周恩来：戊甲丁癸\n\n                  戌寅卯卯\n\n          丁火得势而有癸水之病，有戊去之。\n\n          黄兴：甲甲甲甲"
- id: shouke-qi37-梁启超B月干异文
  name: qi37-梁启超B月干异文
  bazi:
