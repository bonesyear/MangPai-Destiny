  raw_quote: "6．乾造： 壬戊乙丁\n\n          子申未亥\n\n  问：财税所所长己卯年被人打死，怎么断此年死于非命？\n\n  答：乙木秋生喜见火，怕见水，原局丁火被坐下亥水合，行亥运忌神到位，合绊丁火凶。又水多水漂，见木便凶。"
