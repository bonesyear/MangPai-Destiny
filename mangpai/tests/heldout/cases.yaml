  raw_quote: "3．坤造：壬乙庚壬\n\n                   子巳子午\n\n           此造从儿格用水，夫宫子水为喜，忌见官杀夫星；原局水火之力丰相当，但行运入东方，泄子水又生助巳午火，这样夫宫就制不住夫星了，故无法找到如意郎君，几次恋爱都失败。"
