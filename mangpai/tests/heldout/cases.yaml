  raw_quote: "7、乾造： 己乙丙己\n\n                   丑丑辰亥\n\n         此造为《导读风集》一命，在辛酉运的己已年死，说明此造未从，以身弱看，破其日主原神而死。何此造未从？乙水印星报在亥，印星有根，故不能从。"
