  source: shouke-ans10:3990;zhenbao-qi10:329
  raw_quote: "2、坤造：甲甲癸辛\n\n                                  午戌亥酉\n\n                  大运：癸壬辛庚\n\n                       \
    \       酉申未午\n\n                此造比较中和，从时到年一气相生，可成顺格，没有明显的忌神。伤官制杀生财，又为八字的秀气，可见伤官是命局的贵气所在。“伤官喜用比劫成”，故水应该是八字的用神。此为名演员林青霞，壬申运出道走红。辛未运伤官入库，渐息影，后嫁富商。顺格者八字没有忌神，所以不管走什么运都不\
    \ 差。"
