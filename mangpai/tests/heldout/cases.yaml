  raw_quote: "例坤造：丁 甲 戊 甲\n\n       酉 辰 午 子\n\n八字身衰用火，子午冲火受伤。夫官受冲婚姻先天有问题。行戊申运申子辰合旺水局冲午，可断此运离婚。离婚时间可应子年，可应辰年，一般不应申年，因申不在八字中。再看夫星，丙子年丙与甲不发生强烈的作用，而庚辰年庚甲相冲，更主要的是忌神申金在太岁中透干，此为太岁反客为主，庚去甲木，该年离婚。"
