    应期: 丙子年冬三个月牢狱
  source: shouke-qi31:1412
  raw_quote: "又例，乾造：丁壬庚戊\n\n                     酉子辰寅\n\n         郝先生断：此命丙子年冬会有近三个月的车狱之灾，破财两万。实际此人因贪污两万元公款，被收审72人，除追回两万元还实际花销两万。如果不明白其中的诀窍，是无论如何看不明白的。请学员也分析一下为何此造子水为忌神。\n\
    \n         下一期专讲台湾名人李敖。"
- id: shouke-qi32-过路财神
  name: qi32-过路财神
  bazi:
    year: 丙申
    month: 己亥
    day: 甲申
    hour: 甲子
  dayun: 癸卯
  gender: 男
  verdicts:
    财命: 富·有钱但过路财神无法积累
    官命: 是·日禄归时贵命
    应期: 癸卯运得财容易/丁丑己卯庚辰年得财多
  source: shouke-qi32:1434
  raw_quote: "再例，乾造：丙己甲甲\n\n                     申亥申子\n\n         这个八字用神是什么？如果应用所教的方法判断，首先取丙火调侯用神。他的格局是从禄格，以时干甲木为干禄，日禄归时为贵命。因甲木生在冬天不长，调候的目的只是使木更好的生长。很显然已土财星为忌神。忌神虚透论吉，故此造有钱。行癸卯运劫财临旺得财容易，丁丑、已卯、庚辰，财出现之流年得财多。但己土财星有生则不能大富，且表示钱财无法积累，是过路财神。此造申金七杀为实忌神，邻亥子泄掉为吉，放能贵。"
- id: shouke-qi35-检察长
  name: qi35-检察长
  bazi:
    year: 甲辰
    month: 戊辰
    day: 戊戌
    hour: 庚申
  dayun: 壬申
  gender: 男
  verdicts:
    官命: 是·地区检察长
    职业: 公检法
    应期: 93年提升/99年任检察长/95年升职上报未获批准
  source: shouke-qi35:1518
  raw_quote: "乾造：甲戊戊庚\n\n                辰辰戌申\n\n          大运：己庚辛壬癸\n\n                已午未申酉\n\n          此造是一位地区检察长，让我测运，我先说过去：“你从92．\
    \ 93年开始升职，95年有一次机会，可能会失之交臂。可以肯定99或2000年你已升了。”他讲：“我93年提升，95年提升之事己报上去了，上边说我没有基层工作经验，没提。上边治觉得欠着我，到99年提了。”我说：“你2005年还会升，在这之前的几年一般，今年有调动的可能，但调不调差不多，还是维持现状的好。你虽在政法部门，可你的性格谦和，没有杀性与威严，人缘关系都有不错。”\n\
    \n          这个命如何看？首先应该确定庚申是用神。为何他能入检察机关做工职而不是做生意？原因就是八字是年上有七杀，这食神的意向便是去制杀而不是去生财，故不成生意人。杀作忌神，忌财生杀，喜官杀被制的流年。行辛未运辛金这喜，癸酉年戊癸合合去癸财为喜，辰酉合击木之根为吉；乙亥年乙与庚合，乙木被制又同时合运食神，为提升之意，但逢亥水财星长生甲木，拱未成木，忌神根得旺去之不尽，故困基层工作经验不足之由未批（地支可类象为基层）。已卯年行人壬申运，卯申暗合，去官显，甲己明合，动杀星，动而被去意为调动升职（实际就是调升），此年任检察长。此运中见壬水这忌，行至乙酉年乙庚合动用神同时又去忌神宫，又主升职。八字食神为用贴身，人必谦和，杀远隔而弱，无杀性。"
- id: shouke-qi35-贸易公司经理
  name: qi35-贸易公司经理
  bazi:
