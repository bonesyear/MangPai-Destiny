    职业: 犯罪·人贩子
    应期: 庚辰年被抓
  source: shouke-li003:762;zhenbao-li003:592
  raw_quote: "例3 坤造：癸   乙   甲  丙\n\n          未    丑   戌  子\n\n小王问我此人是干什么的，我说着是个很明显的骗子，庚辰年乙庚合入七杀，会被抓。他说此人是一人贩子，将一妇女卖了好几次，今年被抓。行庚午运庚辰年，午冲去子，杀去克身，必然被抓。人贩子也是骗子的一种。\n\
    \n推而广之，一个命如果日主弱印又衰，一般不会诚实做人，如果印星虚浮则用虚假的东西掩饰自己的空虚；如果他财星重则骗财，有官杀则迟早会翻船；如果是伤食重则会骗得虚名。骗子的手法也有不同，虚透正印者表现的会很本分，利用合法手段做掩饰；虚透偏印者吹牛不着边际，会说自己无所不能；正偏印混杂者手段更高，二者具备。"
