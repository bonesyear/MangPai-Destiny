  raw_quote: "乾：  癸甲癸癸\n\n          酉子卯丑\n\n    洪秀全造，寒水不生木，坏了印根，印又坐败地，日主从强，金为用神，甲伤为忌，时上归禄，以禄当官，辛酉运差，庚申运甲庚冲，庚能去甲伤病神，申金生水力大，故能金田起义，在庚戌年。\n\
    \n    行已末运，甲子年死了，子末穿，穿倒禄神而亡。丑士不克水，原局无官杀，大运见之无妨。\n\n    例101"
