  source: shouke-qi22:994;zhenbao-qi22:721
  raw_quote: "l、坤造：辛庚庚己\n\n                 亥寅寅卯\n\n           大运：辛壬癸甲乙丙\n\n                 卯辰巳午未申\n\n         此造庚金无根，有印生但印也无根，故八字作从财格看。用神是水木，乙亥年发财。"
- id: shouke-qi23-闹婚不离
