  raw_quote: "丙辛己辛\n\n              辰丑丑未\n\n          大运：壬癸甲乙\n\n                寅卯辰巳\n\n          行甲辰运今年辛已年。我说：“不是他没有对象，而是今年对象多的选不过来”。问：“选个什么样的？”答：“找下个小巧可爱的，高的大的他看不上。不要找戴眼镜的和大眼睛的”，问：“不找近视眼？”，答：“也不是，他本人就近视，找那个眼睛不大，也可能是近视的，但可能戴隐形镜或小戴眼镜”。又问：“他适合从事什么样？”答：“自由职业、大学老师。记者、律师之类的，不喜欢当官。”答：“凡己知的你都有说的对，未知的还待验证。”\n\
    \n          作业：分析以上断语。"
