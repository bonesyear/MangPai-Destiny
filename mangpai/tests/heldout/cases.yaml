  source: shouke-qi16:726;zhenbao-qi16:571
  raw_quote: "又例：坤造：   丁    己   辛   辛\n\n                未    酉   丑   卯\n\n行癸丑运，夫宫丑土伏吟，丈夫去了很远新疆任职，夫妻两地分居。\n\n又一例：比尔.盖茨： 乙\
    \   丙   壬   庚\n\n未   戌   戌   戌\n\n行辛巳大运土丙辛合，合绊丙火用神不吉，庚辰年印星伏吟，印主企业，为忌神伏吟，故今年微软被联邦法院宣判要一分为二。如果是印做喜神伏吟，则可能是兼并别的企业，扩大规模。\n\
    \n作业：举出一个伏吟应用的例子。"
- id: shouke-qi18-局长
  name: qi18-局长
  bazi:
    year: 乙未
    month: 丙戌
    day: 丙寅
    hour: 壬辰
  liunian: 庚辰
  gender: 男
  verdicts:
    官命: 是·局长92年科级95年副处
    职业: 官员
    婚姻: 平·80年庚申年结婚
    健康: 平·无其他疾病灾祸
    应期: 92年提升/95年又升/庚辰年最后机会/77年丁巳年订婚/98年提升过组织部常委会拖而未成
  source: shouke-qi18:800;zhenbao-qi18:612
  raw_quote: "乾造：乙   丙    丙   壬\n\n      未   戌    寅    辰\n\n大运：乙 甲 癸 壬 辛\n\n      酉 申 未 午 巳\n\n朋友介绍说他是某地方的一位局长，从命中看此人也是个当官的。我先从性格说起：“你做事光明磊落，做人堂堂正正，又具有开拓精神，有创意和革新能力，不是庸碌之辈。“这些赞美之辞也是符合命主实际的，因此造属于伤官佩印的割据，用神是寅木和壬水。日主丙火如太阳，故喜光明磊落，时上七杀为用神，主有闯劲，开拓能力强，坐支偏印为用，偏印主聪明、勤奋，不循规蹈矩和创新性。\n\
    \n他反馈说正确，我哦开始推断他过去的官运：“你从小86、87年开始起步转好，88年到91年平淡，岁努力工作但不见成效，领导也为赏识。92年提升，这是第一步；95年又升，98年要准备提升，但我分析恐怕难成，白努力。你的八字不错，大运走得不好，每一次提升都十分艰难。而且按你的能力来讲不是现在的职务。”\n\
    \n他反馈说完全正确，86年进入一个好单位，92年提升科级，95年提升副处，98年提升之事已经通过了组织部与常委会，眼看已经成了，因为要上的那个位置的人因为安排不理想不想走，一直拖到现在。\n\n我的推断依据是：八字用水，行癸未运未戌刑，未墓开，论吉。86年丙寅，用神寅木伏吟，论吉；87年丁壬合去七杀，卯未有拱合之意也吉。但未运毕竟是土的本气，晦火为忌，故在火土流泄木晦火又克水，不论吉。壬申年入壬午大运，壬水用神受申生而旺透，申冲寅为发动，故推断为调升。切不可将申冲寅看作是破。因寅木本身在八字中无冲克，大运也不冲克，太岁来冲主动，况申金也不是强旺之金，不会冲破寅木。95年寅亥合，喜神亥水合身，寅木得生主吉，切不可将寅亥合看作是合绊，因寅亥合为生合，又因为寅处于主的位置，为喜神合我。戊寅年寅木为用伏吟主有好事，但透戊土忌神克杀，更坏的是寅午戌合火局，寅木用神被泄，寅木变质，不帮日主，故好事来不了。而在丙寅年因不在午运，好事能成。\n\
    \n最后我推断庚辰今年提升十分有可能，要他抓紧活动，亥子月能成。又断他以后之官不会再提升了，今年是最后一次机会。他讲今年占他那个位置的人要退。\n\n此八字又无其他疾病灾祸"
- id: shouke-qi19-伤官去官官员
  name: qi19-伤官去官官员
  bazi:
    year: 辛丑
    month: 乙未
    day: 戊申
    hour: 辛酉
  dayun: 辛卯
  gender: 男
  verdicts:
    官命: 是·32岁后官运亨通
    职业: 官员
    婚姻: 平·命犯桃花93年处女友顶多一年96年又遇机会她跟别的男人好了
    应期: 93年升官/99年又升官
  source: shouke-qi19:834;zhenbao-qi19:632
  raw_quote: "乾造：辛  乙  戊  辛\n\n      丑   未  申  酉\n\n大运：2甲癸壬辛庚\n\n       午巳辰卯寅\n\n此造与第十八造都是我朋友介绍的几位外地官员。这个人的生时酉时与戌时不清楚，经我校正确定酉时无疑。我断的第一句话是：从你的八字看父母身体不好，如果你从小不离开父母的话，恐怕父母的寿命不会长。\n\
    \n他的反馈说父母早十几年就不在世了。他本人已经很早离开老家，巧的是他父母的去世都是在他返乡之后跟父母一块时突发病死的，并告诉我死亡流年。\n\n关于父母死亡的大运推法，留作以后再讲，我只讲八字中如何看出的：月令干支猪父母宫，受年柱天克地冲，我以前讲过官杀可当父看，今乙木正官正好在月干，而命主的印星也在月令，主父母早逝。\n\
    \n我看这个八字属伤官去官格，就肯定地断：“你32岁后官运亨通，93年升官，99年又升官。”他点头称是。我又讲：“你人聪明，擅搞权术，每次升官都很顺利，不用太费劲。”他讲每次升官都是领导主动提拔。\n\n为什么这个八字是伤官去官格？为什么伤官去官格行官运也能升官？首先，格局成立的条件是官星作忌神，不管日主旺衰如何。此造戊土岁生与未月得令，但土无原神，未土又被丑土冲坏，虽然说两土逢冲其土性越冲越旺，但同时土冲变虚，对与戊土之根来说则等于根被冲坏，戊土无所依托，以从格看。我们前边讲过，当日主旁边官与伤官同时出现的话，日主之意向是伤官而不是官。从伤官则见官为混局，做忌神看。伤官主聪明、多能会说话办事，伤官有官出现伤官之意向便不去谋财，而是为谋官。无财星混局反而贵。\n\
    \n有人会问：日主从伤官比劫为忌，官能去比劫应做喜神看，为何把官当忌神看？这个问题必须澄清，从格的本质是日主无依要从一种势，所从的势是越大越好，越纯越好，而不是日主越衰越好。我们在第五期布置作业的那个命，就与此造相似。\n\n再回答第二个问题，行辛卯运为干伤官支官，表示此运中官星被伤官彻底制服，作一个不恰当的比喻，就如警察抓坏蛋一样，只有在坏蛋出现的时候，才能被警察抓住。这个辛卯运就是去伤官的应期，故此运会升官。流年应期又在酉年和卯年。他把自己的聪明才智（伤官）用在权力争夺，将“官”玩于指掌之中，故擅玩权术。\n\
    \n"
