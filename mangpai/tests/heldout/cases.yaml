    \    午\n\n          此造夫星卯与夫宫申暗合，八字不从，以夫宫为忌，先天婚姻就不算好。看行至甲午运夫星虚透，遭伤官克坏，辛巳年冲亥水关财门，正闹离婚。估计会离。"
