  raw_quote: "例2、乾造：庚丁甲乙\n\n                      子亥子亥\n\n           此造从强，八字无财以妻宫为妻，今子见亥患妻，故两次婚姻（因亥出现会代替子），辛已年引动第二个妻子亥，离异重娶。\n\
    \n          配偶宫、星偏重杂出，为重患，必离。但若重见伏吟为轻患，有可能离，也有可能婚前不顺或婚后分居。一般为忌神者多数会离，为用神者多数不会离。"
