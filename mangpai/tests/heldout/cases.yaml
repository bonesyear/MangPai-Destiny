  source: shouke-qi02:206
  raw_quote: "又例：甲  壬  庚  戊\n\n         午  申  子  寅\n\n  大运： 癸  甲  乙  丙  丁\n\n         酉  戌  亥  子  丑\n\n   此造是我去潍坊时遇到的一命，断：癸亥年升职，壬申、癸酉年升职，正确。此为工商局局长，据说是个大贪官，戊寅年妻患脑瘤作了手术，己卯年自己患面瘫在医院治疗。原因很简单，贪得财太多了。此造恐在戊寅运被查办，或得疾症而死。"
- id: shouke-qi02-王立军易学家
  name: qi04-王立军易学家
  bazi:
    year: 壬辰
    month: 丁未
    day: 庚辰
    hour: 庚辰
  liunian: 丙子
  gender: 男
  verdicts:
    职业: 文化·知名易学家
    财命: 破财·丙子年亏损100多万把家底亏了
    健康: 凶·乙亥年受重伤
    应期: 丙子年大亏
  source: shouke-qi02:2314;zhenbao-qi02:137
  raw_quote: "乾造：壬丁庚庚\n\n                辰未辰辰\n\n           此造以禄当财，时干庚金为“干禄”，用神土与金。此为知名易学家王立军先生，我在北京遇他时，让我看他的八字，我第一句话就说用神为湿土和金，他说正确。他让国内许多知名命理学家看过，多数说此造用水，少数说此造用火，没有一个说用土金的。他本人搞紫微斗数推丙了年不太好，但那么多人说好就相信了别人，结果亏损了100多万，把家底部亏了。他壬子运十年不顺，甲戌年太岁冲辰吉。乙亥年乙庚合，子运中金衰被合去，受了重伤。丁丑年子丑合去了忌神子，该年有一大商人拿着上亿元资金找他作股票，他因为怕自己运气不好给人家亏了，没敢接。今年庚辰年吉，去了深圳。\n\
    \n          有学员对何种情况下以禄当财把握不准。实际上当你看到他财星、官杀星、伤食星都无法作用神时，八字又有禄，就可以禄当财，取禄为用。当财、官、食、伤有用时，即不可以绿当财。王立军命丁火官星被合，食神与官星两失其用，故以禄当财。而颜锋提供的一造：\n\
    \n          己丁庚庚\n\n          酉卯辰辰\n\n          丁火官星有用，喜用财官，不可用禄。"
