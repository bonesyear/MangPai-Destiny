  source: shouke-ans38:2926
  raw_quote: "作业：乾造：戊丁乙壬\n\n                午已酉午\n\n    说说此造的毛病在哪，能成为贵命吗？\n\n    思考：本节讲忌神的三种制法，喜神有几种扶法呢？\n\n    答：此造初看严然贵格，忌神酉金得旺火制服，似乎仕途无量。细看有严重的毛病，局中丁壬合，旺火用神被弱制。旺忌神喜弱制，同样旺用神怕弱制，故而此人性格小气，心胸陕窄。例行火地能得父亲蔽荫，到金地可能就差了，成不了大气。\n\
    \n    喜神有弱喜神与旺喜神之分。弱喜神扶而无用，只当闲神看，用作对忌神的合化转化。旺喜神则可生扶。\n\n                      第三十九期作业答案"
