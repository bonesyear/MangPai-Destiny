  raw_quote: "例乾造：甲 己 戊 庚\n\n       辰 巳 寅 申\n\n行癸酉运丁丑年会有什么事？\n\n   一个易友答此年印星巳火被合坏，母亲死了；另一个易友说他身体有病，眼睛或心脏出了问题。实际第一个错误，第二个基本正确，此年眼睛瞎了。因巳火为日主之禄，原神寅木被克坏，寅木在日柱，禄与日柱俱为主，故为自己的事。若寅在年支被坏，可断母亲死亡。\n\
    \n   最后一条，太岁是外来的是客，八字大运作用“太岁”或“征太岁”的说法欠准确，但太岁反客为主时（即太岁干支与八字某支见禄见比时），即可确定八字的一种应期，即这一年要发生八字中该字代表的吉凶之事。"
