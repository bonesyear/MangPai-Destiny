  raw_quote: '????乾造：乙??庚??丁??甲

    ??????????酉??辰??未??辰

    ????大运：己??戊??丁??丙??乙??甲

    ??????????卯??寅??丑??子??亥??戌

    我说：“你的命木衰生不了火，到甲戌运冲了木根，恐怕连老婆也侍侯不了啦。”

    他说：“你的水平大有进步，这也能看出来。”我说“看出这来不算啥，我还能看出你去年泡过歌厅，老婆那儿不行，去歌厅就行了，我说的对不对。”

    “你还行，什么事也瞒不了你，去年有人拉我上歌厅，找了小姐，我说不行，人家给我一点药，吃上就管用。”卯戌合，破而逢合，戌主歌厅之意。

    如果追究起来，戌为歌厅看来很有道理，甲戌年应该是全国歌厅开始火爆之年，色情业泛滥。戊寅己卯年一拱一合戌，发展到了极点，到了庚辰年破戌，中央打击色情业，各地歌厅纷纷倒闭。'
