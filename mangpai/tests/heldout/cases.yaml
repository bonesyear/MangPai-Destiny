  raw_quote: "例坤造：甲  丙  乙  己\n\n           申  子  丑  卯\n\n     大运：乙  甲  癸  壬  辛  庚\n\n           亥  戌  酉  申  未  午\n\n   此造以伤官丙作用神，金水为忌神。丈夫为金。夫宫丑也为忌神，丈夫对她不好。行入庚午运伤临旺而官星虚透，伤官与官相见而克，庚辰年夫星太岁出现为应期，夫得心脏病去世。有人说忌神之金被去为吉，为何为凶？实际吉凶是相对的，壬申运的时候丈夫打她很凶，辛未运的时候她作生意赚钱，丈夫除不帮忙而阻碍她的生意，庚午运丈夫的去世使她没有拖累，生活得可能更好。同时，我反对把用神绝对化与终身化，八字也同六爻卦一样，看丈夫之事就以官鬼为用神，官鬼被坏主丈夫死亡，又主凶。用神只管行运之好坏，生死则另有看法。郝先生看命从来不讲用神，有他的道理所在。\n\
    \n   作业：岳飞：癸  乙  甲  己\n\n               未  卯  子  巳\n\n   与另一男命：癸  乙  甲  庚\n\n               卯  卯  寅  午\n\n   一个是民族英雄，明载史册，一个普通干部。他们的用神都是水，癸卯造辛亥运乙亥年升职。他们俩为何有如此大的差别？\n\
    \n   提示：用“有”与“没有”的理论。\n\nwww.yibooks.net 易书在线 要好书请到我的网站上下载。"
