  raw_quote: "例2，坤造：辛戊庚乙\n\n                     亥戌午酉\n\n         此女一看便知是个有钱人，单今年炒股就赚十几万。为何断有钱？燥士不生金，身弱官作忌，财也为忌，财星虚透合身主富。为何炒股？它为忌无制化，在公家干混不下去；时见财为门户财，主财进财出，刃头财主风险，非炒股不可。赵宇命：丁末、壬子于、丁巳、辛亥，也与之相似，干什么都不行，最后走上了炒股的路。"
