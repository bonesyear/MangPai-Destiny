  source: shouke-li002:2212
  raw_quote: "例2，乾造：辛庚戊壬\n\n                       丑寅子子\n\n            大运：7己戊丁丙\n\n                   丑丁亥戌\n\n           \
    \  他是前造同来的朋友，我一看也是个难看的八字，但有共同之处。前者印星用财，此则印弱为病，同样用财。同是去印得权，可推他也是个官。我说：  你是八十年代未九十年代初升职的。到37岁后运就差了，在98年工作个顺受制。2000年犯小人，想调动调不成。他说完全正确！\
    \ 98年还降了一级。\n\n          印为忌，丁亥运丁印自合支亥，去印得官，故升；丙戌运印不能去，戊寅年长生火，故不好。庚辰年丙火直克流年之庚用神，庚反客为主，不好。去克印想调动，但辰戌冲，生庚的辰被冲，调不成。\n\n \
    \          例3、颜峰提供此造：甲丁癸丁\n\n                               午卯酉卯\n\n          辛未运升为福建省某厅厅长，正是酉印为忌，去印得权之应。"
