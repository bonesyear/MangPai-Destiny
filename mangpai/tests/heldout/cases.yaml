    健康: 凶·车祸身亡
    应期: 乙卯运庚辰年车祸死
  source: shouke-ans06:3856;zhenbao-qi06:198
  raw_quote: "乾造： 壬庚 丙 壬\n\n                   辰戌 申 辰\n\n      大运：辛壬癸甲乙\n\n                  亥子丑寅卯\n\n    八字从财，以土泄火生财作用神也作寿之星。看似士多，实际戌土为忌神不作寿之星，年支辰太远又逢冲，故年月辰戌之上可不看，这样只用时上一辰士，符合少而精，且处于“主”的地位。今辰土空亡兆其寿不会长。乙卯运卯辰穿，穿倒寿元星主死于此运。有人会说卯戌合解卯辰之穿，实际六合与六穿、六冲的地位是一样的，不能说合可以穿解冲，只能合穿兼论。庚辰年为死亡的期，一方面辰土出空出现，另一方面辰成冲使卯戌无法合，可一心一意穿辰。此年车祸身亡。印主车，“穿”者撞之意。\n\
    \n                        第七期作业答案"
- id: shouke-ans07-仇甫全作家
  name: ans07-仇甫全作家
  bazi:
    year: 己卯
    month: 丁丑
    day: 庚戌
    hour: 庚辰
  gender: 男
  verdicts:
    职业: 文化·作家编辑教师
    官命: 否·文化系统职员（民办教师→县文教局机关→报社负责人庚午年年底免职）
    应期: 壬申运最好/甲戌运最差/丙申年参军/己亥年文章得罪领导失入党提干机会退伍/壬寅年回农村作民办教师/己酉年丧母/庚申年民办转公办/辛酉年调县文教局机关/丙寅丁卯年小说全国获奖全家农转非/庚午年调报社任负责人受骗遭整年底免职
    健康: 平·1-10岁常生皮肤病疟疾
  source: shouke-ans07:3884;zhenbao-qi07:221
  raw_quote: "2、乾造：己丁庚庚\n\n                        卯丑戌辰\n\n      大运：丙乙甲癸壬辛庚\n\n                 子亥戌酉申末午\n\n              \
    \  此为经常在各易刊发表文章的仇甫全先生，他对自己的命理分析认为：腊月之金为寒金，需火来暖，火为调候用神。土金为忌，水为闭神。按我讲的理论，此造丁火坐寒士，根被冲刑坏，卯木无法生过来，火无用，必从禄用湿土与金，跟王立军先生的八字很相似。究竟谁的对，看他的经历便知。\n\
    \n                他自传中讲：1～10岁小时常生皮肤病，虐疾，学习成绩欠佳。11～20岁稍好，学习和身\n\n          体部转好，丙申年参军，入伍后连连发表文学作品。己亥年文章得罪领导，失去入党提干机会，退伍。21一30岁为一生多灾多难之年，壬寅年由大学的编辑回到农村作民办教师，文革受整，己酉年丧母。31～40岁此十年命运有所转机，其文学作品、教育论文在全国报刊发表。41～50岁吉，80年庚申由民办转公办，81年由乡镇中学调进县城文教局机关。丙寅、丁卯年小说在职全国获奖，全家\
    \ 农转非。   51－60岁，是一生中财运较的年份，但 9   0年受骗上半，暗中遭人整，同时当年调报社任负责人，出版小说，但有人攻击他小说是毒草，年底免职。仇先生以丙寅、丁卯年吉就认为他用木火，其实这是壬申大运去流年忌神论吉的一种应期。丙子大运，丙火忌，子水也忌，且子丑合绊用神之丑，故不吉；乙亥虽不算吉运，但不损用神土金，平常，甲戌最差，甲木生助忌神丁，戌土冲去用神辰，哪有好日子过。癸酉运好转，因癸水去丁忌神，酉金去卯木忌。壬申运，壬去丁，日生得禄是最好的运气。\n\
    \n          辛未运并不算好，所谓财运的好转也只是工资的增加，全国人民的收入都在增加。庚午年午未合绊忌神宫，有提升的机会，但大运流年都有入暧地，木逢暧地必长，故会上当受小人暗会。若按火作用神，金作忌神。甲戌运木生火，火通根应最吉，壬申运应最差，可见懂命的人确实不多。"
- id: shouke-ans07-李后启校长
  name: ans07-李后启校长
  bazi:
    year: 戊寅
    month: 甲寅
    day: 甲戌
    hour: 甲子
  dayun: 丙辰
  liunian: 庚子
  gender: 男
  verdicts:
    职业: 教师·22岁当小学校长
    官命: 是·小学校长
    应期: 丙辰运庚子年当校长
  source: shouke-ans07:3914;zhenbao-qi07:225
  raw_quote: "4、乾造：戊 甲甲甲\n\n                                寅 寅戌子\n\n              此为命理研究者李后启先生造。他的自评中认为：身旺直流通，取火作用神。我认为取得很对，他在文中讲：“此命我与不少预测者研究过，但一般主张用辛金正官。”此造取金没有半点道理，我看此造的第一感觉就是取火作用神（《滴人髓》曰：甲木参天，脱胎要火）。接着我又考问了跟我周围学命的人，答得都没差错，没有一个人认为可以用金的。只要你拿到此造的第一感觉用火，说明你的用神已经到家了。我对学生的要求是，取用神应90％以上取对，把取对用神看作“小学毕业”。\n\
    \n              李启后先生对自己一生的解评基本正确，但他将丙辰运庚子年22岁当小学校长解释为：“杀透干制比肩忌神”。实际应理解为杀为忌虚透干，被大运丙制，得官。\n\n              我手中这本资料共有五位搞命理者自平八字，只有李后启先生取对了用神。陈园写的书我没有细看，据王虎应老师讲只有一个八字取对了用神。李洪成的资料、书我翻过，约有一半八字取不对用神。\n\
    \n          当今命界之狼籍可见一般。\n\n    5、庚庚庚戊\n\n         子辰辰寅\n\n    此造是我的同门师兄，比较难找用神。实际是水作用神，金为喜神，火上为忌，木作用神也小为\n\n错。辛酉年结婚，癸亥年~丁卯年发财，戊辰年赔光还欠债，至丙丁年才有好转。行至甲申运财运很好。\n\
    \n                                    第八期作业答案\n\n             丁辛乙丁"
- id: shouke-ans09-任氏落魄文人
  name: ans09-任氏落魄文人
  bazi:
    year: 癸巳
    month: 戊午
    day: 丙午
    hour: 壬辰
  gender: 男
