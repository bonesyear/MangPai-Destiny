  source: shouke-qi35:1540
  raw_quote: "坤造：乙己乙己\n\n                 丑卯卯卯\n\n          此造行辛巳运辛已流年辰月，得急性肾炎住院。此命是木旺从强，但她是春天的木，本可用水，但局中无水，用不起来。故只能用木，火与金俱是忌神。行运却行入火地，泄其木，故得病。\n\
    \n          作业：甲丙辛丁\n\n                辰黄卯酉\n\n          分析此造的用神。"
- id: shouke-qi37-袁世凯
  name: li181-袁世凯
  bazi:
