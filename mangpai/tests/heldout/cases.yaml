  raw_quote: "乾：  丁辛戊丁\n\n          未亥子巳\n\n    郝先生断：此造差一点当皇帝，印重当不了皇帝，穿倒羊刃死于非命，死于乙巳运辛亥年，日禄归时，禄先天被亥财冲破，对子女亦有害，禄在丁巳旺地，不能受冲，爱财好色，妻子亦是二手货。\n\
    \n    它杀：有制有化者代表权利、地位，男代表子女星，女代表夫星，官匪，官司，合身还主桃花事件。\n\n    七杀：暴力性，聪明，己卯日主者走聪明，戊寅亦然，心计特强，多脾气不好，心劲特强，报复性强，无制者又为小人，坏人。杀印相生者主贵。官杀混杂行官杀运，岁运并临必死。\n\
    \n    正官：守本份，保守，循规蹈矩。\n\n    财星：代表财，男命代表妻，代表子女宝贝。代表色、欲望。身旺财为子，身弱印作儿。同时亦代表女性之色情，虚财则不代表财富，而代表才能或才华。\n\n    例84"
