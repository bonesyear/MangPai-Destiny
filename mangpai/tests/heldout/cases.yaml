  source: shouke-qi50:2250
  raw_quote: "3、乾造：庚癸甲己\n\n                 戌未寅已\n\n         造是内食神格，用神是巳火与寅木，癸水为忌。可断你辞去公职为好。实际此人为研究生（癸印作忌神有制，学历高），离开公职，在外企工作，收入颇好。"
