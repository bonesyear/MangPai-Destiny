  source: shouke-qi14:1200
  raw_quote: "乾造：辛戊甲甲\n\n      巳戌寅戌\n\n大运：丁丙乙甲癸\n\n酉申未午已\n\n         虽然宋先生对些命断了许多，但我认为他并未解透此命。首先他认为此造不能弃命从财，以偏财格看，但这个治身明显弱，财明显旺，书日：财多身弱乃富屋贫人，怎么能是一位掌管亿万财富的大企业家呢？其次，宋先生认为此造大水，还用风水法补水，可见宋先生是把此造当身弱财旺断，忌神是火土，问题就在于他行甲午运按说是大忌神运，为何在此运中他经营的企业不仅不有破产倒闭，反而是蒸蒸日上成了当地一大富豪呢？反而在癸已运见到水时，出现了严重的回禄之灾，这些疑问是本造最大的困惑。\n\
    \n         我的解释是，此造必为从格！《满天髓》曰：五阳从气不从势，五阴从势无情义。许多人都对这句话不太理解，其实此造就是对这句话的很好注解。何谓“从气”？何谓“从势”？我的理解是：势者外在之力，气者内在之本，常言道：“人多势众”、“形势不好”都是人面对外在的压力的表达：而说“生气”、“鼓气”、“他气”都是人对自己内心的体会。所以从势者所从的是天千克耗“我”者（外在压力），从气者所从的是地支泄我者（内在自我），这是阴阳本性的差异。故甲木弱无印星，见地支伤食必弃命而从。\n\
    \n         此造之殊在于地支寅戍暗拱伤官里，这是此八字的脊索，而绿神寅木是他自己的本体甲的入支内化，正因为寅的存在，才使日主“从气”得以完整实现。\n\n         由此可见，此八字的用神是午火与寅木，七杀、印星及子透之火都是八字的忌神。所以他甲午运最好，而到癸已运巳穿坏了寅木，开始变坏。\n\
    \n          郝先生称这类格局为“内食神格”或“内伤官格”，如果伤食透干则坏了格局，毫无富贵可言了。\n\n         郝先生讲：内食神者被人吃，外食神者去吃人。要是内食神成格者则被一大群人吃，他一定是为社会创造财富的企业家。我的一位企业家朋友的命也与此造相似："
- id: shouke-qi15-伤官当财
  name: qi15-伤官当财
  bazi:
