  source: shouke-ans32:2848
  raw_quote: "乾造：辛辛癸癸\n\n          卯卯亥丑\n\n    此造在丙戌运包下发财，请大家分析一下他丙戌运发财的理由。\n\n    答：此造辛为用神因虚而无用，看作闲神。身弱以财为忌，行丙戌运与命中辛卯天地合，为绊合。\n\
    \n闲神辛合去忌神丙，主得财。卯与戍都是忌神，两忌神合绊主吉，故此运发财。\n\n                          第三十三期作业答案"
