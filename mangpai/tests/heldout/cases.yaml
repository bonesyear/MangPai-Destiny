  raw_quote: "例：乾造： 丁  辛  丙  己\n\n                巳  亥  戌  丑\n\n     此造身弱，财作忌神，行己酉运，一直不太好，但在庚辰年却赚了一笔钱，如果单看金做忌神，是讲不通。庚辰年为什么会赚钱？但，我们讲流年看刑冲化合，看事情的应期，而不是看它是不是用神。庚辰年辰酉合，忌神酉金，财星被绊，故发财。\n\
