    应期: 甲寅年结婚/辛未运离婚
  source: shouke-li001:3062
  raw_quote: "例1乾：己丙丁甲\n\n            卯子未辰\n\n    先天无财，妻宫未食为妻，代表女性，年透己食与妻宫末食是一致的，甲印是己食之官，甲己合表示婚前已破身，已妻自坐印杀，为二手货。\n\n    甲寅年结婚，过去的男性不存在了，而卯未半合，未中有杀，未为杀气库，婚后仍有大量的男性与妻交往。癸酉运冲去卯杀，妻与外情人无交往，可行壬申运，卯杀又回来了，甲子年水生卯杀，妻与外情人交往频繁，在辛未运，未食复吟，与妻离婚了。\n\
    \n    刑冲克害：\n\n    天干五合：甲己合、乙庚合、丙辛合、丁壬合、戊癸合。\n\n    地支三会、三合、六合、三刑、六冲、六害（穿）\n\n    例2"
