  raw_quote: "3、坤造         丙癸辛癸\n\n                                寅巳酉巳\n\n                  大运：     壬辛庚\n\n             \
    \                 辰卯寅\n\n                答成是用神金水，正确。辛金夏产，极喜癸水润泽，清明秀丽。此为美国影星马莉莲’梦露，生于 当地时6月1日上午9：30分。孤儿，庚寅运长生忌神已火，陷入政治漩涡中，两巳火为肯尼迪兄弟，都占有她。壬寅年日主逢绝，无路可走。推其为谋杀，非自杀。\n\
    \n                        第十一期作业答案"
