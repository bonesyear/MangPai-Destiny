  raw_quote: "例2，乾造：丙辛己丁\n\n                      戌卯亥卯\n\n          大运：3壬13癸23甲33乙43丙\n\n                 辰    己   午   未 \
    \  申\n\n           此造初看身弱用印，因印是贴身透干而生身，但从实际经历看，他忌火喜木，可见是从了官。局中己坐亥自合，不受丁火之生，故而可知天地合之重要性。\n\n           他甲午运印运中，文革后被认为四帮的爪牙而受整。乙末运戊午年平反，后在私企工作，收入很高。未运做过一次生意，赚了十几万。丙运辛末年任总参四部山西办事处主任。到申运，癸酉年办洗煤厂，开始还行，但到戊寅、己卯年陷入困境。"
