  raw_quote: "乾：  壬癸戊丙\n\n          辰卯辰辰\n\n    戊癸合，妻星合入日主，老少配，妻宫辰与日主戊是一个东西。此造有两个妻，日时辰伏呤是移动，亦是一个东西。命主家教很严（月令为官之故）。\n\n   \
    \ 关于子水与亥水的区别：十二地支的特点，子水是木的败地，子水为流动之水过路的水。\n\n    亥水为死水，池塘之水，是木的长生之地，与木形成生合的关系。\n\n    子水不生卯木，子卯刑，子破卯，使卯木的根腐烂。\n\n    寅木生午火最强，寅午合火局。\n\
