  raw_quote: "15、乾造：癸丁戊庚\n\n          巳巳寅申\n\n问：为何是亿万富翁？\n\n答：申食神自长生财，为用神，行入北方水地，大吉。若换成酉时则大劣，是个小生艺\n\n人罢了。"
