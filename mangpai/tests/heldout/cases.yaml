    职业: 银行家·董事长
    婚姻: 平·辰运有婚外情人
    应期: 庚辰运始发/辛巳运一事无成
  source: shouke-ans15:2612;zhenbao-qi15:545
  raw_quote: "乾造：       乙甲己己\n\n                             未申未巳\n\n                大运：      癸壬辛庚\n\n                   \
    \         末午已辰\n\n                此造为某银行董事长（后改为商业银行），从庚辰运始发，创办银行，在辛巳运中一事无成。\n\n此造申金伤官当财，伤官不透不为八字秀气，申金遭末土燥，巳火克，行辰运生助伤官。同时申\n\
    \n          辰拱水，《卜义命学》中讲到暗拱指隐性的存在，故此运中有婚外情人。\n\n                                  第十六期作业答案\n\n              壬辛甲己\n\n \
    \             寅亥戌已\n\n    为何戌士为忌神？\n\n    答：此造有旺用已火泄秀，同时以火暖局调候。但命中巳火紧贴戌士，巳会人墓于戌。故以戌土作忌神看。我们以前学过，用神入基，冲墓神可放出用神：合墓神则墓闭，可阻止用神入墓。故喜行卯运利财。他好的年份为丑运壬戌、及甲寅运戊辰、庚午与卯运己卯、庚辰年。"
- id: shouke-ans17-虚名骗子型
  name: ans17-虚名骗子型
  bazi:
    year: 壬辰
    month: 丙午
    day: 甲寅
    hour: 丁卯
  dayun: 辛亥
  liunian: 己卯
  gender: 男
  verdicts:
    职业: 骗子·骗得虚名
    官命: 否·无官杀无牢狱
    应期: 辛亥运名贯中外/己卯年受镇压逃至国外
  source: shouke-ans17:2640;zhenbao-li003:601
  raw_quote: "乾造：     壬丙甲丁\n\n                 辰午寅卯\n\n      大运：      丁戊己庚辛\n\n                  未申酉戌亥\n\n        1、看这个命的贵贱可分析他的格局，甲生午月极喜水润，伤食泄气过甚，配印以制伤食，生扶日主，属伤官佩印的格局。伤官佩印是大格局，一般主贵。这个命的格局有瑕疵，其一，他的印星没有原神，故他的地位不稳固，是虚的；其二，他的禄刃过旺，损了格，表示他的私欲强，所生伤官太旺，太张扬，又由无法纪，不懂得韬晦，所以成就不了大业。\n\
    \n      2、伤食重印弱透干，属骗子的一种，会骗得虚名。偏印者会吹牛不着边际，什么大话都敢说。\n\n但命中无官杀克身，故无牢狱之灾。辛亥运用神得地，又逢金水之流年，名贯中外，无人不晓。己卯年，卯辰穿倒印根，受镇压，门户伏吟，逃至国外。\n\
    \n                        第十八期作业答案"
- id: shouke-ans18-CCTV编导
  name: ans18-CCTV编导
  bazi:
    year: 乙卯
    month: 辛巳
    day: 壬申
    hour: 辛丑
  liunian: 庚辰
  gender: 女
  verdicts:
    职业: 文化·电视台编导
    婚姻: 平·谈对象半心半意未定
    应期: 93年上大学/丁丑年谈对象不成/己卯年获比赛二等奖/庚辰年研究生毕业再获一种文凭又谈对象半心半意职业面临选择
  source: shouke-ans18:2656;zhenbao-qi18:623
  raw_quote: "坤造：     乙辛壬辛\n\n                  卯巳申丑\n\n      大运：    壬癸甲\n\n                  午未申\n\n      我断：“你93年离家上学，至现在一切都十分顺利。你应有两种文凭或学历，今年（庚辰）会又获得一种文凭。去年的时候你还获得过一种荣誉性的奖励。”\n\
    \n      她证实所断一切正确，93年上大学，今年研究生毕业，去年获得某某比赛的二等奖。\n\n      我又说：“你命中带着帮助你的人很多，遇事总有人帮助，有靠人的命。今年你的职业会面临着一种选择，有工作变动的意思。”\n\n\
    \    她说：“说的对，你看我动好，还是不动好？”\n\n                                              第69页\n\n              我说：“动也不错，不动也不错，动的话利于你的事业发展，你有了自主性，还比较心忙，不动的\
    \ 话就轻松些，名头不错，但自主性差，你自己选择吧。”\n\n              原来今年地区电视台让她回去主持一个栏目，回去自主性肯定大，在中央电视台人才济济，发展起 来会慢许多。她随后又问婚姻，我答：\n\n       \
    \         “你9 7年开始谈对象，这个不成，今年又谈一个，但你们俩关系处得并不很近，可以说你还没有决定要嫁给他，对他总是半心半意。”"
- id: shouke-ans19-格林斯潘
  name: ans19-格林斯潘
  bazi:
    year: 丙寅
    month: 辛卯
    day: 甲午
    hour: 癸酉
  liunian: 丁卯
  gender: 男
  verdicts:
    官命: 是·美联储主席
    职业: 官员·央行行长
    应期: 丁卯年8月任美联储主席/丙午年入尼克松内阁/甲寅年入政府/丁酉运戊戌运最好掌管美国经济
  source: shouke-ans19:2688
  raw_quote: "格林斯潘命：            丙辛甲癸\n\n                                      寅卯午酉\n\n              大运：    10壬20癸30甲40乙50丙60丁70戊\n\
    \n                          辰      已       午   末       申      酉       戌\n\n              经历：父母庚午年离异，随母。丙午年入尼克松内阁；甲寅年入政府；丁卯年8月任美联储主席。乙亥年母去逝。\n\
    \n              格氏是伤官去官格命，地支官星被制者官大，此造妙在时支见酉，被午火紧贴制服。时于癸印为忌神，忌神虚透则表示才学过人，当然这个命午火伤官也表示才学。一生以学识才能从政。\n\n              他的丁酉运与戊戌运最好，掌管美国经济，为什么？因此运酉金出现被伤官丁火压住，为午火制服酉金的应期，这种匹配正好如警察捉坏蛋。而在戊戌运，戌中辛金被寅午成合的火局完全制服，也是掌权是大运。这个八字用神是火伤官，伤官是生财的东西，火“炎上”主快，故美国经济会在他的掌管下飞速增长。他八字无明财，以月于辛金当父看，丙辛合将辛合去，表示从小离开生父；时上之西金当继父。\n\
    \n                                          第二十期作业答案"
- id: shouke-ans21-双妻妻私通
  name: ans21-双妻妻私通
  bazi:
    year: 丙申
    month: 辛卯
    day: 甲戌
    hour: 戊辰
  dayun: 甲午
  liunian: 丙寅
  gender: 男
  verdicts:
    婚姻: 差·双妻命第一妻与人私通
    应期: 甲午运丙寅年妻私通
  source: shouke-ans21:2714;zhenbao-qi21:705
  raw_quote: "乾造：丙辛甲戊\n\n                         申卯戍辰\n\n              此造行甲午运丙寅年，妻与外人私通。宋先生讲是因为寅午戍火局把戍士引出来，这是个歪理。此八字卯戍合，戍被绊，寅午戍三合局不成立，寅午半合局可成。八字先天妻星戍土被辰冲卯合，即是双妻命，第一位妻被人勾引的垂象。只是因卯被申暗克合，卯木暂不敢妄动，今逢寅午合火局克申，申被克变弱，遭太岁寅冲为冲破，卯木自然可以顺利劫得戍财。但与之相似的一造：己酉、戊辰、甲戌、丁卯，也逢羊刃卯合妻宫财星戍，就不能说他妻被人勾引了（实际也没有），区别在于后造之卯处于“主”的位置，代表他本人，而不是别人；前造之卯却处于“宾”的位置，代表别人。可见“宾主”在八字中的重要。\n\
    \n                                          第二十五期作业答案\n\n              比尔盖茨命：乙丙壬庚\n\n                                \
    \      未戍戍戌\n\n              问，为何是尖端技术产业是大富翁？\n\n              答：庚为印为技术，作忌神虚透被制说明他本人是技术专家；戍中辛金被未刑，处于受制服的状态，表示他所管理的是一批高技术人才；又庚印在时上出现，时为门户，可引伸许多内涵，如：时尚的，进出的，外面的，灵活的，前沿的，故为尖端技术。相反如是月令的东西，则可以表示：内部的，传统的，保守的，稳固的，基本的，我的印在月令，也注定是研究最传统的东西。\n\
    \n                                        第二十七期作业答案"
