  raw_quote: "例乾造：己  丁  乙  丙\n\n           丑  丑  卯  子\n\n     大运：丙  乙  甲  癸  壬\n\n           子  亥  戌  酉  申\n\n   此命看子息，以食伤丙丁为子女星，丁食神为子，丙伤官为女。食丁见丑财必先生子。而大运行癸酉运枭神夺食，况有时见伤官早子难存的信息，故其子于１０岁时死于非命。逢子卯刑，卯与子两伤，一方面说明一生为子女而伤心操劳；另一方面表示有子必为过房，子卯之刑巳无法形成血缘关系，卯被刑坏妻子也无法再生育。\n\
    \n   《命理指要》及《滴天髓》是有关刑的例子很多，学员在阅读时说注意领会即可。\n\n   作业：许多学员的用神尚未过关，故多留此方面作业。"
