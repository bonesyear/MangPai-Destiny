    \ 子   亥   戌   酉   申   未\n\n         以官杀为夫，宫杀重现多婚之象，成为第一任丈夫（寅戌半合），盖头丙为用神，故第一任丈夫对她好，但丙辛合绊丙，又丑刑戌，故不久（死亡）；第二任丈夫丑土（寅丑合），盖头辛金为忌神，故对她不好，行戌运刑之，也不久（离异）；第三任丈夫是辰土（夫宫寅之原身甲盖之），甲木为用神，又夫妻寅水用神制之，故好。"
