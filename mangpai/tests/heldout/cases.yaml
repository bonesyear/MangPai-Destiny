    应期: 乙亥丁丑年得财/庚辰年破财不吉/98年工作不顺与领导闹意见
  source: shouke-qi05:1790
  raw_quote: "乾造：庚丁丁癸\n\n                戌亥巳卯\n\n          大运：戊己庚辛\n\n                子丑寅卯\n\n          我说：你去年到今年个好，今年还跟领导闹意见。95、97年有财，98年也不好，工作不顺。你富命不大，财运一般，今年后半年财运会有所好转。他说你说的对，最近刚与领导吵了。你看我的领导有多大？我说跟你的年龄差不多，是属羊的？他说是属猴的。他妻问：“看看我们的住宅有没有问题？”从命中看住宅我看的很少。但我感觉有信心，分析一会就断：“你家的厕所在西北吧？不在西北就在东边。”“对，是在西北，以前住过的家厕在东边，”我说：“是下水不很通吧”，“是，常堵”。“这个对你家风水不好，还有一个不好的地方，你家床在东头吧，你家的床为什么下边是空的，什么东西也没放？”他很惊讶地说：“是呀，床在东头，是个钢管架子床，没法放东西，下边是空的，自从我家买了这床后运气就不顺了，那该怎么办？”他花了三千元的床换了也不好，我便想了一些五行化解的办法，解决厕所与床个好的问题，也不知是否有效果。\n\
    \n          此造以用官为用，寅运合绊官星。戊寅年又合绊，最差。庚辰年官星人墓不吉。原局财入宾，又不生用神水。庚为别人的财不是自己的财，只有合绊才可得。乙亥年，乙庚合财。丁丑年寅丑合财俱可得财，庚辰年财无合。辰泄日主生了庚财，等于是自己破了财给了别人，故断不吉。辛巳年辛暗合已火，巳为自己，主自己得财，但上半年木火旺，无财，下半年金水旺，会有财。\
    \        看住宅以戌土伤官为厕，因戌为伤官，是排泄的地方，又处于年最不重要的位置，故定位为厕，戌在西北，又合卯，也可定位在东，今戌克亥水官为忌，故此处不好，克水，主下水不通畅。宜用金的五行物来化解；将卯木定位床，因卯为印主保护我者，可作床看。印表示他的地位，也是升官的必要条件，今印逢空亡，故床下空不吉，宜用填实的方法化解。\n\
    \n          又一中年男子推命，公历五二年二月六日，立过了春以癸巳年正月看。"
