  raw_quote: "l、神造：癸庚庚壬\n\n                   丑申子午\n\n         此造金水成象，用神是水，配偶官子水为用神，冲去配偶星忌神，此为好婚姻。虽然是她管丈夫，但她丈夫很喜她管，感情稳定。"
