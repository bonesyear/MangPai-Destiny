  raw_quote: "例4、坤造：壬壬戊丙\n\n                      寅寅寅辰\n\n          此造大宫多重伏吟，但未离，只是婚姻波折很大，与对象好了又不好再好。之所以未重婚，还有一条就是夫宫夫星非忌神，能长生用神丙火，喜神的成份大。"
