  source: shouke-qi41:1916
  raw_quote: "l、坤造：乙辛辛壬\n\n                  卯己酉辰\n\n         此造按五行生克讲，夫星已火合入夫宫，夫星也有原神，伤官也不克夫，很难看出其婚姻有什么问题，然而事实上此女为歌舞厅的歌女，属淫贱之人。其命局之要害是辰酉相合，禄绊为桃花，桃花外合，会与外人、生人乱搞。"
