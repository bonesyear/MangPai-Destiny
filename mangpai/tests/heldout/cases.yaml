    应期: 丑运下岗/甲戌年下海
  source: shouke-qi50:2244
  raw_quote: "2．乾造：壬庚壬丁\n\n                  寅戌午未\n\n        此造丑运单位倒闭下岗。此造月干印为工作，若作用神看，太衰又无力生日主；若以从强看，有印又为病神，这就表示他的工作是食之无味，弃之可惜的那种。到丑运庚人墓，表示单位不行了，破产倒闭，他甲戌年下海，至甲寅运一直在外打工。"
