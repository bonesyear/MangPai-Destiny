  raw_quote: "11、坤造：辛乙癸丙\n\n          卯未酉辰\n\n问：怎么样看庚子运丁丑年死丈夫？\n\n答：酉为夫，辰酉合，不是生助夫而是合绊了夫没有了生气，再加之酉之原身辛透于被\n\n丙合，故夫遭灾。庚子金死，丁丑金人墓。"
