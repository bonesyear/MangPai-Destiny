  raw_quote: "又例，乾造：壬辛甲丙\n\n                       寅亥寅寅\n\n          此造官星极衰无用，本可用食神池秀，却逢丙辛合，无法用食神，只能以禄当财。不喜命中禄神太多，多则不贵。故此人人性太好，赚到钱老被别人欠债或借走。年支禄神为宾，合用神亥，分去自己的钱。乙卯运己卯年赚了钱，因禄临旺乡，甲己合动日主表示这一年命主自己享到了“禄”。有人会问，禄怕劫财为何乙卯运会吉？此同八字中原无劫财，行卯运为禄临肚乡，非分禄之意。\n\
    \n第五期作业答案"
