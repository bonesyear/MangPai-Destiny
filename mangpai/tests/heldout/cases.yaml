  source: shouke-qi23:1088;zhenbao-qi23:776
  raw_quote: "再例，坤造：辛己丙丁\n\n                    丑亥午酉\n\n         此造与上造类似，夫位午是喜神，夫星亥是忌神。现行癸卯运庚辰年与丈大闹婚。与上造不同的是，卯虽破午，但能化忌神亥，不是完全的忌神，入此运后与丈夫关系还过得去，只是今年才发生较严重的冲突，此因辰土穿坏卯木无法化忌神亥之故，过了今年就会好了，可断此造离不了婚。"
- id: shouke-qi27-比劫去杀连升
  name: qi27-比劫去杀连升
  bazi:
    year: 癸酉
    month: 甲寅
    day: 乙卯
    hour: 戊寅
  dayun: 丁未
  gender: 男
  verdicts:
    官命: 是·官职连升
    应期: 丁未运官职连升
  source: shouke-qi27:1246
  raw_quote: "如，乾造：癸甲乙戊\n\n                   酉寅卯寅\n\n              大运：癸王辛庚己戊丁丙\n\n                    丑子亥戌西申未午\n\n      \
    \   此造身极强而从强，两金杀星为忌神，被旺本所破，此为比劫去杀而成格，戊申运官星申金被八字中旺木所去，以吉论。丁末运日主得根，杀星也被制，官职连升。\n\n         印星配财，也是两种情形：身旺印重，印为忌，八字中财星能制印，再行财星制印大运，也为官。\
    \ 相反的情况是，身弱，从财或从儿格，有印星为忌神，被旺财所制，行财运去印也为官。\n\n         印量配伤食，《命理指要》中所讲的伤官配印格只是其中一个类型，还有另一种情形，即身弱从伤官，印星作忌神，被旺伤食所制也为官。"
- id: shouke-qi27-厅级
  name: qi27-厅级
  bazi:
    year: 甲午
    month: 丁卯
    day: 癸酉
    hour: 乙卯
  dayun: 辛未
  gender: 男
  verdicts:
    官命: 是·官职连升至厅级
    职业: 官员
    应期: 辛未运连升
  source: shouke-qi27:1260
  raw_quote: "如，乾造：甲丁癸乙\n\n                   午卯酉卯\n\n            大运：戊己庚辛壬\n\n                  辰已午未申\n\n         此造日坐之印星被两卯所冲，为冲破无用，日主无依必从财，印为忌神。行辛末运忌神虚透，被八字中财星问制，官职连升至厅级。有人会问此造从财格发财才对为何能当官？是不是也发财也当官？非也，因八字印为病神，财之意向是去印，表示才华与才能。非钱财之意。此造也可以归为E类印星配财的组合。\n\
    \n         综上所述，我们不难发现，大多数当官的俱与官杀及印星有关，何也？官杀主职务，印主权柄。而为何两者必须得根才算有官呢（不管作用神还是作忌神）？因为地位与权力是管理社会，是落“地”的而不是上“天”的。如果虚有地位或虚有权力时（虚透天干），那除了是社会名人之外就可能是演员了。\n\
    \n        推而广之，命理中看财、看学业、看．父母……所有的东西都不是单纯一个字能代表，它们形成于八字的某种组合与配置中，也就是十神组合形成的意向。"
- id: shouke-qi29-逃兵老农民
  name: qi29-逃兵老农民
  bazi:
    year: 戊辰
    month: 辛酉
    day: 壬子
    hour: 癸卯
  gender: 男
  verdicts:
    官命: 否·一辈子当老农民
    职业: 农民·曾参军逃出
  source: shouke-qi29:1318
  raw_quote: "例，乾造：戊辛壬癸\n\n                    辰酉子卯\n\n         此造年上杀星被月令印星泄尽，印星坏了杀，杀不能抑身为用。郝先生是这样断的：印绶两重印绶坏杀，若七了兵肯定受伤（受伤是因子破卯），但死不了能当个军官。可惜是因服小怕事不思进取而中途退怯，到头来只能是个农民。实际此人曾参加过解放军，南下时因怕死又想家而逃出，一辈子当老农民。\n\
    \n         官杀星所代表的是职务、地位与权力；还代表官匪、官司、疾病、桃色事件。七杀还有其它的含义，如可表示有心计、严格、多能、脾气不好等。大干七杀在特定时候可表示名声，地支七杀则表示心力强，有心劲。\n\n        \
    \ 财星代表财富这只是一般的看法，实际财星还代表欲望，引伸为色欲，不管男女都的这层意思。财速干而虚则能代表才华，还可以讲会来事、场面上的人。财在地支多是一种欲望的象征。偏财色欲方面表现的尤其突出。\n\n         食伤星的差别比较明显，食神性温顺，所有优良的特点都是食神上体现，如人好处、善良、大度、正义、体恤、享受、快乐、自由。天干食神多是靠技艺而从事受人尊重的职业；地支食神多是为人辛劳的职业，一旦成格得运会从就很大的事业。伤官则傲慢、不切实际、聪明到近似猾头、使心眼、不守规矩。见风使舵、投机取巧。伤食也有共同的地方，如都表示自由而不愿受约束，所以印星克坏有用的伤食会有牢狱之灾。伤食见金受制服有军人的含义。\n\
    \n         比劫是争夺之星，比温和而幼凶狠，羊刃是凶中之凶，羊刃有胆大。凶恶、自以为是等特点，有兵刀、手术、灾祸等象。怕过旺或过弱，过旺受生成凶，过弱受克成灾。最为有特点的是禄神，禄有自尊自爱自强的特点，表示身体、女人的肉件、自己所拥有的一切、权力、、财富、寿命。\n\
    \n          作业：分析下列命的性格和职业："
- id: shouke-qi30-张克东
  name: qi30-张克东
  bazi:
    year: 壬申
    month: 己酉
    day: 癸巳
    hour: 辛酉
  dayun: 甲寅
  liunian: 辛酉
  gender: 男
  verdicts:
    财命: 巨富·资产过十亿后破产入狱
    职业: 商人
    应期: 甲寅运大发/辛酉年破产入狱/庚申年开始败落兵败如山倒
  source: shouke-qi30:1352
  raw_quote: "张克东：壬己癸辛\n\n                 申酉已酉\n\n         大运：3庚13辛23壬33癸43甲\n\n                 戌   亥   了  丑    寅\n\n  \
    \       他的经历大约是：出生寒微，早年困顿，70年代崛起于商界，头脑聪明，点子多。甲运前五年即甲 寅、乙卯、丙辰、丁巳、戊午、己未大发其财，资产过十亿。庚申年开始败落，兵败如山倒，辛两年企业破产还入狱。\n\n        \
    \ 台湾命理学家分两派观点，一种认为是身强用财，比劫为忌。这一观点能解释甲寅运的前半段辉煌，解释不了癸丑运掘起及甲寅运的后半段跨掉。所以肯定是错误的。我们分析一下命理，财星已火无原神生助，又被两酉夹合而化，原气尽失，无可用之理。用火的理论完全错误。\n\
    \n         另一派认为此造是专旺格。喜金水忌火土。但解释不了为何早年困顿以及甲寅运的上半段辉煌。\n\n         其实这个八字是从禄格以禄当财，虽八字无禄，即可把日主当禄。偏印主鬼才，即有超常的头脑与智谋。年通劫财分禄为忌，早年行庚戌运财得很不好；行辛亥运劫时得禄也不好；壬子运劫透干也不好：至癸丑运禄神透干，巳酉丑合印局助禄并去忌神财，故能掘起于商界；甲寅运则是喜忌均沾之大运用，八字中己土克禄为忌，甲合去己土救日主，为用神无疑；但寅木却生助巳火忌神，此运人于喜而地支忌。\n\
    \n         这里涉及到一个问题，即甲寅大运是统一十年看呢，还是要上下五年分看呢？我以前一直认为是十年统看：但郝先生讲：十年统看也对，上下五年分也对，就看是流年如何作用了，如流年与大运不发生刑、冲、合、并则上下五年是分看的，一旦出现刑、冲、合、并则要十年运统看。\n\
    \n          我们分析这甲运的五年：甲寅、乙卯、丙辰、丁已、戊午与地支寅的关系只有巳年穿寅，其它四年与寅不发生刑、冲。合、并，俱看作甲起作用寅不起作有，那么这些年份基本都是以吉看（丁已年刑寅可以断不好，资料中未作大待无法核实）。到己末年入寅运，应该说从这一年就开始倒运了，只不过田己合，等于己土忌神反客为主，被甲木制还无妨（流年与大运大干五合发生，以十年大运统"
- id: shouke-qi31-贪污坐牢
  name: qi31-贪污坐牢
  bazi:
    year: 丁酉
