  raw_quote: "2、坤造：癸癸辛癸\n\n                    丑亥亥巳\n\n          此造金从水，从儿，忌官，伤官亥冲巳，夫宫喜冲去夫星忌，管丈夫，但婚姻很好。家道丰盈，过得日子很不错。"
