  raw_quote: "例1，乾造：辛戊甲丁\n\n                    卯戌申卯\n\n         财多身弱，无印劫财卯木为用。乙亥年之后发财数十万，生起卯木之故。有人问，此造卯申暗合是否表示妻暗与他人乱搞？非也，因此造甲木之根在时支卯，卯木就代表他自己，而不是别人。年上卯在“宾”位表示别人，所以他年轻时一直找不到对象，31岁才结婚。卯申暗合还表示他暗中与当官人交往甚密，从公家那里取得财。"
