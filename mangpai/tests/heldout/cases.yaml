  source: shouke-ans10:3978;zhenbao-qi10:327
  raw_quote: "2、     乾造：乙癸丁戊\n\n                                 巳未丑申\n\n                                  已末丑申\n\n      \
    \            大运：壬辛庚己\n\n                              午巳辰卯\n\n                此造为身弱不能从，用神是木。癸水杀星为忌虚透，戊癸合去之无害。此造在庚辰运辞职下海，创业十分艰辛。癸酉年前半年倒霉，辛酉月揽到一笔生意，赚了三万。此因忌神辰与酉合绊之故。运入己卯，用神到位，现已有百万之富。"
