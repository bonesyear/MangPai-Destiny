  raw_quote: "3、乾造：辛壬辛庚\n\n                       亥辰未寅\n\n              作业：分析此造为何他有第三者？为何伤克兄弟又给出去？\n\n              答：未中有财是他的正妻，寅虽为正财，却与未中之财相混，故为另一个女人。寅与未中含甲己合，故是第三者。\n\
    \n              月令伤官克伤兄弟，又主克长兄，比肩坐伤它就是更进一步的信息。年上伤官伤祖业，不利生身父母。辰中乙是他的生父，是木的退气，表示父无力养育他（退而不想作父了），故给出去。\n\n              \
    \          第四十六期作业答案"
