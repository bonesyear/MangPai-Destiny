  raw_quote: 前一个命是影星阮玲玉，伤食星庚辛金为技术之星，又主艺术。命有乙庚之遥合，伤官庚金的意向便有吸引男人的魅力之意，可理解成性感，人见人爱，美貌出众，故成影星。
