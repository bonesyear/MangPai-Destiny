  source: shouke-li263:7366
  raw_quote: "18、坤造：甲戊癸丙\n\n          戌辰酉辰\n\n问：为何不生儿子，收养他人之子？以及为何五次婚姻？为何说戌土在时上的话会当三\n\n陪？\n\n答：丙财为儿，子女宫与夫宫是丙的衰死之地，不故为会生儿；原局甲生丙，甲在宾位，故是要的儿。\n\
    \n几个官杀几次婚，此造有四个官，之所以五次婚，财星生官也算了次，只不过时间短而\n\n                已。\n\n此造官星合印必是明媒正娶。印主结婚证书。如戌在时是则穿倒了印，此女必会滥支男\n\n人，不守妇道。\n\n\
    19、冲造：甲辛乙己\n\n          寅末亥卯\n\n问：怎么分析此造命局？怎么看丈夫外边有情人？\n\n答：此造以卯禄为用神，亥为喜神，故会嫁的好夫（从农村嫁给厅长家儿子）。年月之"
- id: shouke-li263-走私被扣
