    财命: 富·效益极好
    应期: 2001辛巳年辞职单干
  source: shouke-qi50:2256
  raw_quote: "4．乾造：庚辛癸甲\n\n                 寅已卯寅\n\n        此造从此格，以月干印星为忌，辛自坐巳，自合去之，故此命忌神得制，是好命。在一家医院工作。行至丙戌运，又合去辛克去庚，时上寅木用神生助财星，在个开诊所，因效益极好，于2001年（辛己）辞职单干。"
