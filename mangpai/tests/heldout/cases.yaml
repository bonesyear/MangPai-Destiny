    ???

    此为咸宁一位市长。李洪X说身弱用火，李涵X说从官。李涵X肯定说的不对，从官，官为用神，官星壬水弱为喜神弱，决主无官；再说寅木长生火，又不逢破，丁火有气有生，不能从。实际此造既不从官，也不是身弱用火，应是调候用暖。丁火本身对季节不敏感


    ，但它所依赖的寅木却太寒不长，故喜行暖地，大运一路走暖，故吉。庚辰运虽辰土晦火，但对调候来讲却吉，故决不会在此运倒霉，反以吉断。有人会说乙亥年巳亥冲会冲去巳火不吉，实际调候用神还有一特性，就是不怕刑冲破害及合化变质，任何一种有形的五行金木水火土都害怕被坏掉，惟有调候是一种季节，一种时间，是无形的，所以不怕被破坏。


    ????又例：赵X：?丁??壬??丁??辛?????

    吾造：（段建业造）丁??辛??乙??丁

    ????????????????未??子??巳??亥未??亥

    ?巳??丑

    ??????????大运：庚??己??戊

    ????????????????戌??酉??申

    ???

    我的同学赵X与我行运一样，他用神应该是木火，我的用神是调候。

    这就有了差别。庚戌运是他火得根，学习会名列前几名；我在此运一直中等。

    己酉运之甲戌年，他用火极好，这一年开办了厂子；我用甲不用戌，前半年倒霉，

    甲戌月之后赚了几千元，差别很大。到乙亥年，他用火乙木可生火，酉绊巳，亥冲巳，吉凶互有，所吉者亥冲巳，酉不能绊巳，用神冲出主吉，所凶者亥过旺又最后将巳也冲掉，

    结果前半年赚了十几万，后半年厂子倒闭，收摊子。而我却在这一年最倒霉，

    收入特别少还得了一年病。我从９８年之后渐暖，逐年好转，他却不见起色，

    至庚辰年我越来越好，他平淡，父亲还得了病。戊申运为土金，对于我用调候来讲是渐入暖地，而他却未必能好过我。'
- id: shouke-qi14-亿万企业家
  name: qi14-亿万企业家
  bazi:
    year: 辛巳
