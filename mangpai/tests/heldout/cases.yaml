  raw_quote: "坤：  乙丁乙己\n\n          未亥丑卯\n\n    1、管皇帝的。2．乱怀不乱朝。3、伤夫克子。\n\n    亥卯末合禄，丁亥暗合，亥为丁食之官克子，亥水为用，水生禄神，以卯禄当官，禄神逢合，禄为身，乱怀。\n\
    \n男性不为乱怀，只指朋瓜多。禄占了位，子星逢合，克夫伤子，同治帝死于亥年，“同治”是管皇帝的，丁亥暗合，将子合去，同治死在辛卯运亥年，丁食至卯为沐浴败地，死于花柳病。用神为亥水，亥代表国家，她最后一代皇帝把国家东西变为她自己的权力上，亥印旬空，辛卯运同治时期，卯木长亥水在被世，权力越来越大，国家越来越衰。\n\
