  source: shouke-li001:2020
  raw_quote: "例1、坤造：己丁壬甲\n\n                        酉丑辰辰\n\n           此女四重配偶星，且患夫严重。可断一生会有四个男人。从与日主及夫宫的关系看，己土算是第一个男友，坐地支酉合夫宫辰，有婚姻关系，但己土太弱无气，可断短暂婚姻。实际上是同居，末办丁续，后分手了。五是第二个男友，其天干丁与日主王合，可断与第二个男友也发生过关系或有短暂婚史。而她正统的丈夫是辰，丑毕竟是唱副角的。实际上是她结婚后（嫁辰士年长的）反过头来与她的同窗丑土有了情，发生于丁丑年。此命又见辰土伏吟，有两种可能，一种是离婚，另一种是两人分居。"
