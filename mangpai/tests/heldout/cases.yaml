  source: shouke-li001:1978
  raw_quote: "例1、坤造：己癸壬癸\n\n                      酉酉辰卯\n\n          此造身旺夫弱，夫星混杂，夫宫夫星被穿倒又合绊，婚姻是必离的。我断甲戌年结婚（夫宫逢合冲年之应），己卯年离（穿夫宫而离）。她说不是，我马上明白她必是早结婚了，先得己土之夫，于是断：“那必是甲戌年离异”。正确。应甲戌年离是因原局辰酉合，夫星己之坐支酉合夫宫，今太岁冲辰不合酉，同时引动第二个夫星辰，故第一个己必离异。可以想见她的第二个丈夫还得离。"
