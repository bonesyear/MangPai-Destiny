  source: shouke-qi16:706
  raw_quote: "例，乾造：壬   辛   甲   己\n\n          寅   亥   戌   巳\n\n甲戌年，忌神戌土伏吟，日主伏吟，主凶。这一年一个小手术给做坏了，爬在床上动弹不得长达三个月之久，痛苦之象可见一斑。哪位学员能解释此命为何戌土是忌神？"
