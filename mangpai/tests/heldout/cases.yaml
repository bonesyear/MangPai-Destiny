    \ 巳  午\n\n此造以创办企业为名，贷巨款在几年内兼并企业达10亿之巨，但所办企业无一赢利。后携款逃往国外，戊午运戊寅流年归案。这个八字的用神很奇特，甲木冬生调候用火，但身衰财星重火要生土，又作忌神看，故行火运就象吹肥皂泡一样，没有根子之木虚长，他似乎拥有很大一笔资产，但都是表面风光，戊土克去生身之印，一切都化为泡影。"
