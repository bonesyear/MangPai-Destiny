  source: shouke-li263:7220
  raw_quote: "3．乾造： 戊癸壬辛\n\n          申亥辰亥\n\n问：从原局中如何看出要离婚三次？ 88年在乙丑运这何有牢狱之灾？ 96年丙子与年丁丑为何能赚钱？\n\n答：此造用神是金水，96． 97是金水旺年。乙五大运金墓，戊辰流年水墓，故入狱。女人太多，三次婚姻说不清楚。\n\
    \n4、城建处处长： 庚丁甲乙\n\n                子亥子亥\n\n  问：此造妻宫伏吟出其不意问题，但为何辛巳年离婚？\n\n  答：子为妻，亥为第三者或第二妻。辛巳年冲亥引动第二妻，故与第一妻离与第二妻同\n\n\
    居。"
