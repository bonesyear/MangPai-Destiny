  source: shouke-ans31:2830
  raw_quote: "2、乾造：甲癸庚甲\n\n                      辰酉辰申\n\n    要理解此造为何癸水为忌神，必须应用十神意向原理。此造若不见财星甲木，癸水可作用神，伤官可当财看。可伤官见了财，伤官意向即为去取财的手段。更为不好的是财星无根虚浮（辰中之根也被酉合坏），又没法用水将木生起来，就表示欲取财而得不到。这样伤官就只能是忌神了。丙子运为财坐牢几次，穷困不堪。\n\
    \n    有学员问为何不把此造看作从强格？我的看法是因辰申拱水（西合一辰，另一辰能拱），泄神有力不作从强。但假如你把他看成从强格，结论也是一样的。首先从强以癸水泄神为忌；财星虚透本以有钱看，可虚透之财有生，则穷了。"
