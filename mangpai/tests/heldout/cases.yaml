  raw_quote: "5、坤：歌厅小姐： 乙辛丙戊\n\n                  已巳寅戌\n\n  问：“财在月令公家取财”这句话什么意思？\n\n  答：财在月令应为公众之时而非公家之财，笔录可能用繁体。"
