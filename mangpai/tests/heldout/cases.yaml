  raw_quote: "作业：坤造：壬辛甲甲      与坤造：壬辛甲壬\n\n                寅亥戌戌              寅亥戍申\n\n    分析她们的个问，说出用神及职业类型（当官、发财或文化、艺术哪类）。\n\
    \n    答：她们的大运是：庚己戊丁丙\n\n                      戌酉申未午\n\n    前造是个女强人，身强以财为用神，官入财库，是为别人理财赚钱，行火土流年事业干的很大。后\n\n造从强，财作忌神，水为用神。戊申运冲寅亥之合，她的初恋情人在日本继承了一大笔财产，因为恋旧情给她200万人民币。\n\
    \nwww.yibooks.net 易书在线 要好书请到我的网站上下载。\n\n                      第三十八期作业答案"
