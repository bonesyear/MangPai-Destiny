  raw_quote: "乾造：癸甲戊丙\n\n                已寅子辰\n\n         1岁行运；癸壬辛庚己戊\n\n                  丑子亥戌酉申\n\n         我说：“你在戌运当官，\
    \ 86年和89年升职。但后在92或93年下海； 97。98年发财， 99年后半年就差了，2000年资金周转不灵，今年的上半个还不行。”他说完全正确。\n\n            此造用丙火明显，七杀配印有权，但印弱须行运印得根才行，故戌运会当官。86年与89年是应期。他89年升某厂厂一长。\n\
    \n           辛酉运伤官生财，作生意，财与伤官俱为忌神，故去忌神反得财。辰酉合绊酉，可赚到钱。逢丁丑年子丑绊子，两忌神全绊，最好。他说这年生意火得很，买主排队买他的货。戊寅年泄水绝金，也行。到己卯年，卯酉冲，解辰酉之绊。下半年金水旺后生意会衰退；庚辰年辰酉合，大运先与流年相合，等于将大运酉绊了，全局子辰半会水成功。有人会说辰酉原合，辰再来为应期到，为何会凶？实际上不能那样理解。要先从原局中看，原局中了辰半会，酉运六合来解会，再见辰，辰就又要回复到原局的子辰会状态。如八字改辰癸已、甲寅、已酉、戊辰，那是辰年则回复辰酉合的状态，用火士的话，为应吉。假如原局无子水，不存在子辰会，那行酉运辰年则论吉。表示回复到辰酉合的状态。故以八字原局先应，大运为次应。到辛已年，吉断，巳本原局相合绊，（内有酉辛合）应绊酉，子辰还会。故此年小利尚可，比去年好，是转机年。丙申月丙到，己亥月亥到冲已，可能能转好。\n\
    \n          在酒桌，一女上求问另一女士的婚姻，命局：\n\n                        戊丁甲戊\n\n                        申巳辰辰\n\n         我断：“此女早婚必离，98年闹离婚，99年离异。”答：“对”！“你看为何离？”“第三者插\n\
    \n足，男的先有，女的后有。”答：“完全正确”。\n\n         解：原局申辰拱合，夫星与夫宫拱着，夫星申为夫（若是甲戌日，夫宫与夫星没关系，则申不作夫看）。今已申原合，等于他的男人一直会与一个女人好，与他是半"
