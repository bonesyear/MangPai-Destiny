    month: 甲寅
    day: 丙午
    hour: 癸巳
  gender: 男
  verdicts:
    官命: 是·梁启超（与li181版月干丙/甲异文）
    职业: 官员
  source: shouke-qi37:1660
  raw_quote: "梁启超：癸甲丙癸\n\n                  酉寅午已\n\n          丙火得势而有金水之病。\n\n          普金：壬己丙甲\n\n                辰酉戌午\n\n\
    \          丙火得势而有金水之病，辰酉合，病神自去。行甲寅运得权。\n\n          周恩来：戊甲丁癸\n\n                  戌寅卯卯\n\n          丁火得势而有癸水之病，有戊去之。\n\
