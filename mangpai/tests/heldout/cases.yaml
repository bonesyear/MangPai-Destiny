    \ 答：庚为印为技术，作忌神虚透被制说明他本人是技术专家；戍中辛金被未刑，处于受制服的状态，表示他所管理的是一批高技术人才；又庚印在时上出现，时为门户，可引伸许多内涵，如：时尚的，进出的，外面的，灵活的，前沿的，故为尖端技术。相反如是月令的东西，则可以表示：内部的，传统的，保守的，稳固的，基本的，我的印在月令，也注定是研究最传统的东西。\n\
    \n                                        第二十七期作业答案"
- id: shouke-ans29-领导司机
  name: ans29-领导司机
  bazi:
    year: 甲辰
    month: 戊辰
    day: 庚寅
    hour: 辛巳
  gender: 男
  verdicts:
    职业: 司机·给领导开车
    官命: 否·侍候当官的命
  source: shouke-ans29:2768
  raw_quote: "乾造：甲戊庚辛\n\n                辰辰寅巳\n\n    答：此造是印重又印不贴杀坏格。本来此造时上七杀能作用神，为羊刃合杀格。但庚金生于三月透戊有生扶，庚金就不会变“懒”，不去辛苦追求那些去了，那七杀羊刃本是成就大业的，但这些都与他无缘了。故这个人是个侍候当官的命（实际是给领导开车）。用神可以是财星。\n\
    \n    性格为人豪爽（财星透），讲义气（金主义），不爱学习（印重），无大志。"
- id: shouke-ans29-一贫如洗
  name: ans29-一贫如洗
  bazi:
    year: 癸未
    month: 丙辰
    day: 戊戌
    hour: 丙辰
  gender: 男
  verdicts:
    财命: 贫·一贫如洗一生未赚过一千元
    婚姻: 差·妻重病
