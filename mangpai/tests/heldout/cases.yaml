  raw_quote: "2、坤造：戊壬乙丁\n\n                   午戌卯亥\n\n          此女虽不是职业卖身，但与许多有妇之夫妻居，也向他们要钱。卯戌合，戌中有辛金杀星，杀在财地其男人必是已婚人的。卯戌内合，只与熟人同居。\n\
    \n           3、网上一长沙的女大学生求测，"
- id: shouke-qi41-流产同居
  name: qi41-流产同居
