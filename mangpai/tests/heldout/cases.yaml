    职业: 文化·落魄文人
  source: shouke-ans09:3952
  raw_quote: "乾造：癸戊丙壬\n\n                己午午辰\n\n      “此人为何不能做官？他骄傲自负，看不起人，决不会讨好领导。他拿别人的钱觉得理所当然，让他拿钱给别人送点礼什么的，比抽他的筋还难，故而虽聪明有余，却无法作为。丙火见年支巳为禄，日主贪禄即只顾他自己，所以成不了大事、与七杀旺不旺关系不大。”\n\
    \n      原来如此！难怪任氏前四十年不好可以理解，后四十年为用神旺地，却依然是个落魄文人，用任氏自己讲的理是无法说得通的。\n\n      其实本期作业的答案也在看一个“禄”字。岳飞八字无禄，禄主自我，自私，自己的，岳飞能成就大业，早已将生死置这度外，心目中已经没有“小我”的存在，有的只是民族大义和精忠报国之心。\n\
    \n而另一个命日主坐禄，私心、私欲很重，其差别不言而喻。\n\n      有人会问：癸乙甲庚\n\n                          卯卯寅午\n\n                此造木旺应喜火泄秀，为何不用火而用水？此因八字水枯之故。春木缺水，不可能成参天大树，而怕的是午火烈日，故补水才是最主要的。"
