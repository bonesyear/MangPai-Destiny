  source: shouke-qi41:1930
  raw_quote: "坤造：庚乙丙癸\n\n                  申酉申己\n\n          辛已年已月怀孕后流产。她说：“每个和我约会的男人都只想和我作爱，而每个被我拒绝作爱的男人都不愿再理我，这是为什么？”我看此命禄被合是犯桃花，便说是她自己命的原因；看她财重又说她自己就很好色，不能怪别人。没过多久又跟我讲，她又与男人同居了，还怕再怀孕吗？唉自己命贱，是离不开男人的。"
- id: shouke-qi41-离婚同居
  name: qi41-离婚同居
