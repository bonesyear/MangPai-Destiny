  raw_quote: "4、坤造：庚戊甲丙\n\n                   子寅子寅\n\n          此造夫宫子水为喜用，夫星庚入“宾”，不看夫星，以夫宫印为夫。原局子水受泄严重，行运甲戌，克夫宫，更夫妻感情很好，但夫体弱多病，拖累自己。"
