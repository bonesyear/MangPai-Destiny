  source: zhongji:5572
  raw_quote: "这个八字的功主要是杀星成局，合制伤官。伤官主头脑，智力，合杀而有用，故能成材。读至博士学位。…戍为数学，亥为数字，是故为数学博士。"
- id: reg67-印制伤食市长
