    此命最难看，他行乙卯运开始发财，至今己成几百万富翁。有人解释为癸水财星为用，被戊合，行木运克去戊土救财。财极衰被合乃去，何能救起？后来又认为是从强格，但从强应喜印，小时候丁巳运家里穷得连衣食都不足。我认为是从禄格，食神酉为病神，去之为宜。

    劫财为忌神，所以他的钱曾被一表兄弟骗过两次。庚辰年为他担保的30万贷款有去无回，银行找他还款，为此他改了公司名称，宣称以前的公司倒闭，但能否逃过索款还很难说。

    ???

    现在的作业是：他乙卯运的哪一年开始起步？哪一年赚得钱最多？

    ???'
