  source: lixiangxue:3137
  raw_quote: "寅卯入未墓（多而墓之），未为七杀之墓，就是权力中心之意，而未土在四柱中又是羊刃，羊刃又有军队的意思，说明他是个军官。未入辰墓，自己控制着军队。实际正是，此人是军中师级干部。"
- id: reg67-制例二
  name: reg67-制例二
  bazi:
    year: 丙午
    month: 辛丑
    day: 戊寅
    hour: 壬戌
  gender: 女
  verdicts:
