  source: lixiangxue:6972
  raw_quote: "丙坐支辰土收两亥入墓，亥为七杀加印，此墓之功量很大，加之又有两伤官如同两盖一样，将两亥盖入墓中，故能官至极品之贵。"
- id: reg67-复例一数学家
  name: reg67-复例一数学家
  bazi:
