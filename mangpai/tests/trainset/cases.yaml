  source: yanjiu:14137
  raw_quote: 赵宇断：这个命年轻时当过兵，当兵后能分到企业，在国有企业工作。对方说：确实当过兵，不过时间很短，几个月就问来了，到了企业。又断：企业能当个中层干部。对方说：是。 / 我此时拿起四柱，直断道：应该在纺织企业。对方十分惊讶，居然连纺织企业都能断出来。 / 赵宇断：在企业干到子运，就不干了，壬午2002年就在外边做生意了。对方说：是，只不过单位关系还在。赵宇断：干到子运结束，2005年就不干了，基本不赚什么钱。 / 我们一致认为，这一年跟合作者关系处理不好，搞不好要打官司，如果不是官司，可能会有身体方面的伤害。对方听了我们的判断，又是一惊，说：确实去年闹翻了，当年虽然没有起官司，但今年打官司了，刚刚起诉。 / 对方说：实际数目是四十万到五十万之间。今年丑官与日主申一家，判断官司一定能赢，但钱要在明年才能拿到。 / 我断：你的命中有儿有女，先生女后生儿，如果计划生育的话，只有一女儿。反馈：对。是有一女儿。 / 命中母亲高寿，父亲有克。估计父亲不在已经六七年了。反馈：太准了！ / 年上伤官，祖业破败，原来你家是一个大家族，但在父亲手中败落了。反馈：对。 / 命中兄弟姐妹四个，你是老大。反馈：兄弟姐妹只有三个，确实是老大。（运岁：大运：02庚辰 12己卯 22戊寅 32丁丑 42丙子 52乙亥 62甲戌；子运壬午2002年做生意；2005年不干；2006乙运做技术指导；2008年闹翻打官司）（注：2009年11月与赵宇同断例）
