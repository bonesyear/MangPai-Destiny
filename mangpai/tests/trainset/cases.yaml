  source: lixiangxue:6993
  raw_quote: "食神为思想之意，官星太弱，这里指荣誉之意；辰土将这些思想汇集在一块，所以一定是位学者或科学家。实际此人是一位数学家。"
- id: reg67-复例四老师经商
  name: reg67-复例四老师经商
  bazi:
