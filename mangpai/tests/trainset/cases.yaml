    month: 癸丑
    day: 丁未
    hour: 辛亥
  gender: 乾
  verdicts:
    财命: "贫·一生穷困潦倒乞食过日"
    婚姻: "差·独身命"
    健康: "差·瞎一只眼"
  source: zhongji:5049
  raw_quote: "乾：丁癸丁辛/亥丑未亥。书：此造以丑中辛金为妻星，妻宫未冲丑，是妻宫欲制妻星，但八字是金水有势而将未土冲坏，是妻星反坏了妻宫，所以是个独身命…现反被局中制坏，所以此命差了。此人一生穷困潦倒，还瞎一只眼，（丑未冲坏了未中丁火，右眼瞎，左眼视力也不好。）乞食过日。他兄弟在唐山地震中死去，他顶了班到了煤矿，后不愿干活，买断工龄拿了几万元回来了。"
- id: zgj-财反局苦力
  name: zgj-财星反局苦力
  bazi:
    year: 戊申
    month: 丁巳
    day: 戊子
    hour: 戊午
  gender: 乾
  verdicts:
    财命: "贫·非常穷年收入不过五千"
    职业: "工人·干苦力活"
  source: zhongji:479;gaoji:3395
  raw_quote: "乾：戊丁戊戊/申巳子午。书：这个八字初看大富，因火土有势，去财子与财的原神申，有功。但存在反局，日时是子午冲，年月是巳申合，这样火土与金水之间一边冲，一边合，就是主宾做功方式反的意思。财星反局财大凶，故此人非常穷，一年收入不超过五千，养活三四口。干苦力活，因财反局了故很贫穷。（中级479）高级3395案例七同盘：财星反局主大凶。实际此人一生极贫，干苦力活，年收入微薄。"
- id: gj-低保伤官
  name: gj-土金伤官困顿低保
  bazi:
    year: 辛卯
    month: 辛丑
    day: 戊申
    hour: 辛酉
  gender: 乾
  verdicts:
    财命: "贫·生活困顿靠低保维生"
    职业: "无业·无正当职业"
  source: gaoji:19657
  raw_quote: "案例四：土金伤官见官，困顿之命。乾造辛卯辛丑戊申辛酉。戊土丑月，地支申酉金成势，天干三辛金，伤官极旺。卯木正官在年，正是「土金伤官怕见官」。伤官与官星对抗，格局破败。命主无正当职业，生活困顿，靠低保维生。伤官见官，心性叛逆，难以融入社会正轨，才华无处施展。"
- id: gj-财党杀攻身
  name: gj-财党杀攻身入狱破产
  bazi:
    year: 甲寅
    month: 丙寅
    day: 庚辰
    hour: 戊寅
  gender: 乾
  verdicts:
    财命: "凶·因财致祸官非入狱破产"
    职业: "商人"
  source: gaoji:1776
  raw_quote: "案例四（财党杀攻身，因财致祸）：乾造甲寅丙寅庚辰戊寅。格局：庚金日主，地支三寅木财星，财旺极。财生月干丙火七杀，攻身…效率：财旺生杀，杀攻身，而印星救应无力。此为「财党杀，杀攻身」之凶格。层次：身弱不胜财杀，必因财致祸。实际为商人，一度富有，后因债务纠纷、官非入狱，破产。此为败格之典型。"
- id: gj-黑社会头目
  name: gj-墓比劫库黑社会无期
  bazi:
    year: 壬子
    month: 己酉
    day: 辛酉
    hour: 己丑
  liunian: 辛巳
  gender: 乾
  verdicts:
    财命: "凶·非法集资暴富判无期徒刑"
    职业: "黑道·黑社会头目"
  source: gaoji:2377
  raw_quote: "案例二（墓比劫库，黑社会头目）：乾造壬子已酉辛酉己丑（OCR已=己）。丑土为阴湿之土，有黑暗、地下、非法之象。丑合年支子水财星（子丑合）。效率：比劫（团伙）入丑墓（黑社会），墓库合财（子丑合），非法取财。层次：墓用结构成，但所墓为忌神比劫，且丑为黑道、牢狱象。实际为黑社会头目，非法集资暴富，后于子运辛巳年，比劫（酉）入墓（丑）之运岁，被判无期徒刑。（异文备案：高级5178案例八同一人作癸丑月：乾造壬子癸丑辛酉己丑，实际为黑道头目，多次入狱。）"
- id: zj-数亿坐牢
  name: zj-非法集资数亿坐牢
  bazi:
    year: 乙巳
    month: 己丑
    day: 壬辰
    hour: 辛丑
  dayun: 乙酉
  gender: 乾
  verdicts:
    财命: "凶·发财5亿乙酉运经济案坐牢没收财产"
  source: zhongji:903;zhongji:2853
  raw_quote: "乾：乙己壬辛/巳丑辰丑。书：此造是用主位辰墓双丑，墓用做功，丑土又拱财星，故有大财。官多财少，官当财看。行丙戌之戌运，财库冲入，发财数亿。到乙酉之乙运时，乙这里可以代表辰，乙透被原局中辛金克坏，等于坏了辰，所以此运大凶，因经济案件而坐牢。没收所有的财产。（戌运发财4个亿，乙酉运破产坐牢…非法集资4个亿，没收了！）（中级903）中级2853同盘：官多而财星少，财可统官…所以他会有巨富。行戌运，冲开辰墓，发财数亿…走戌运冲开辰库，发5年财，有5亿资产！"
- id: gj-入狱一年
  name: gj-三刑搅局入狱一年
  bazi:
    year: 丙午
    month: 辛丑
    day: 戊戌
    hour: 戊午
  liunian: 癸未
  gender: 乾
  verdicts:
    财命: "凶·癸未年因经济问题入狱一年"
    应期: "癸未年入狱"
  source: gaoji:3799
  raw_quote: "案例九（岁运逢三刑，搅局入狱）：乾造丙午辛丑戊戌戊午。原局：火土燥势，戌土刑丑土（戌刑丑），制丑中金水财官，格局很高。大运：正行旺运。流年反局：癸未流年。未土出现，与原局丑、戌构成丑未戌三刑。三刑搅局，破坏了原局「戌刑丑」的单一、高效的做功方式，引入未土竞争、混乱。应事：该年因经济问题入狱一年。此为流年三刑反局，无事生非。"
- id: gj-盲人按摩师
