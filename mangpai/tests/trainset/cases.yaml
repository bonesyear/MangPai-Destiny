  raw_quote: "阳包阴局，地支阳气虽然欠足，但天干阳盖阴，局象上看，是阳胜阴局，寅作公门，故能在警局为官。"
- id: reg67-军官师级
  name: reg67-军官师级
  bazi:
    year: 己卯
    month: 辛未
    day: 戊辰
    hour: 甲寅
  gender: 男
  verdicts:
