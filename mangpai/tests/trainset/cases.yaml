  source: shouke-qi31:1398
  raw_quote: "例，乾造：甲丁乙庚\n\n                   寅卯丑辰\n\n         行己已运壬申年入狱。此造先天结构就是食神与官不和。表示他本人的想法与做法都是与法律规范相冲突的。到已运伤官得旺，自以为是，失去自我约束能力。但必须是官出现之年而产生牢狱，因为这一年官星合绊伤官，表示失去自由。此造是用伤官却犯了旺官，而导致牢狱的。这就是所谓的以身试法，伤官得旺会目空一切，当官星不出现时不会意识到官的厉害，只有官星出现时才意识到犯了官。\n\
    \n         再介绍别一种特殊的牢狱结构，郝先生曾断到过我堂兄的八字，其八字为：\n\n         甲癸庚甲\n\n         辰酉辰申\n\n         郝先生断他有四次牢狱，每次都是一年半载。我在网站及其它易刊中征集答案，没有能解出来的。实际上此造的答案并不难，只是很难让人想到。郝先生讲“金见水沉为牢狱”，这个命癸水是忌神，凡是金见水旺又水作忌神者都是牢狱的表志。此造行丙子运，申子辰合旺水局，沉金，坐牢几次。请学员分析一下为何此造癸水为忌神。"
