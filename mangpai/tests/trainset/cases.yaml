    健康: "差·身体极差体弱多病"
  source: gaoji:1648
  raw_quote: "案例四（泄身太过，体弱艺匠）：乾造癸亥癸亥壬寅壬寅。格局：壬水日主，干支一片水木，水极旺，木亦旺。水木伤官泄身太过。效率：泄秀无节制，日主虚脱。虽有才华，但身体不堪重负。层次：泄身太过，体弱多病。实际为有才艺但身体极差，一生消贫，难以持久发展。此为败格之例。"
- id: zj-独眼乞食
  name: zj-独身独眼乞食
  bazi:
