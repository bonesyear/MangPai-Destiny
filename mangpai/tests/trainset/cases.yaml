  raw_quote: "乾：  壬癸壬丙\n\n          子卯子午\n\n    此进从强，禄神有泄，财里有生，丙午财运讨饭，财在门户，出门见财。\n\n    格局：七类十六格\n\n    八字既有用神，必有格局，格局是为找用神所定，印是帮日主之用，印不独立成格。\n\
    \n    正官：官印格，当印重时必须佩财。财官格，官护财，财生官。\n\n    七杀：杀印格，财杀格，食神制杀格，伤官合杀格，杀刀格。\n\n          杀印格：印化杀生身，七杀自化为用。财杀格：以财制印。\n\n    财：\
    \  食伤生财格，身健胜财格。\n\n    食神：食神泄秀格（南怀瑾）\n\n    伤官：伤官泄秀格，伤官佩印格，伤官泄得太过须印制伤。\n\n    变格：从财，从杀，从儿，从强，化气，顺格，化气格，比禄格。\n\n    例 106乾；\
    \  甲丙己甲"
