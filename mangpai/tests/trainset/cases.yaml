  raw_quote: "例2，乾造：戊己庚丁\n\n                     辰未午亥\n\n          大运：3庚辛壬癸甲乙丙\n\n                 申酉戌亥子丑寅\n\n          此这香港首富李嘉诚先生。书中记载他出生时正皓月当空。查此日为农历十三，合当时情况，而其它生日不合。\n\
    \n          以前一直不理解此造为何会巨富，后来终于明白了。原来他也是旺用神去忌神的结构。八字庚生夏月，火土太燥，从其火土强势。亥水食神为忌。午亥之合能去亥水，谓忌神实而有制。少行庚申、辛酉运不顺其势，少年难辛异常。壬戌运忌神虚透始有好转，自己开始创业。后行入北方水地忌神运，被八字中旺用神所制，是谓去其忌神的应期，一发不可收拾。丙寅运寅亥合绊亥水，无往而不胜，达到顶峰。"
