    hour: 戊戌
  dayun: 戊子
  gender: 坤
  verdicts:
    财命: "破财·子运破财"
    职业: "按摩师·盲人按摩师"
  source: gaoji:10517
  raw_quote: "案例十二：按摩师（禄冲财）。坤造：丙辰辛卯辛酉戊戌。大运：庚寅己丑戊子丁亥丙戌。做功：辛金日主，酉金为禄。卯酉冲（禄冲财），酉戌穿。禄神做功，主体力劳动。取财方式：禄冲财穿印，体力做功。酉金为身体，冲克财星，有按摩、推拿之象。实际为盲人按摩师。运程：丑运、戌运好，子运破财。"
- id: gj-纪检官员
  name: gj-伤官去官纪检官员
  bazi:
    year: 甲子
    month: 丙子
    day: 辛巳
    hour: 丙申
  gender: 乾
  verdicts:
    官命: "是·纪检检察系统官员"
  source: gaoji:1161
  raw_quote: "案例二（伤官去官，纪检之职）：乾造甲子丙子辛巳丙申。格局：年月子水伤官成势，日支巳火为正官。子水伤官制巳火官星。时支申金劫财助水势…效率：伤官势众，制官有力。官星在主位被制，表示以规则、法律（伤官）制约、管理权力（官）。层次：伤官去官格成。实际为纪检、检察系统官员。"
- id: gj-公门转商
  name: gj-入伍转业办公司数百万
  bazi:
    year: 丙午
    month: 庚寅
    day: 辛酉
    hour: 戊戌
  gender: 坤
  verdicts:
    财命: "富·资产数百万小富之局"
    职业: "商人·特招入伍转业与人合作办公司"
  source: gaoji:22066
  raw_quote: "范例二（大运食伤占主导，自谋生路为人巧）：坤造丙午庚寅辛酉戊戌。大运：己丑戊子丁亥丙戌乙酉。命主概况：大学毕业后特招入伍，后转业与人合作办公司，资产数百万。…此造财生官，官合劫，印生身，五行流转有情，故能成小富之局。批命断语：此是公门转商贾，运程配合发家富。（数百万归富档，对齐reg67-普例4/q例几百万富翁口径。）"
- id: gj-副科级
  name: gj-伤官佩印副科级
  bazi:
    year: 甲午
    month: 壬申
    day: 癸卯
    hour: 甲寅
  gender: 乾
  verdicts:
    官命: "是·某机关副科级干部"
  source: gaoji:989
  raw_quote: "案例精解三（一层功，科级）：乾造甲午壬申癸卯甲寅。做功：水木伤官成势，伤官佩印（壬水为印）。伤官主聪明、执法，印主单位。伤官合印，主在单位靠技术、口才立足。层功：伤官泄秀，但制官（午火）之力不强，功神效率主要在于「合印」与「泄秀」，计一层功。实际为某机关副科级干部。"
- id: zj-教师无官
  name: zj-教师想当公务员不得
  bazi:
    year: 庚戌
    month: 戊寅
    day: 丙子
    hour: 己丑
  gender: 乾
  verdicts:
    官命: "否·坐下官不做功当不了公务员"
    职业: "教师·文化机构教师"
  source: zhongji:2308
  raw_quote: "乾：庚戊丙己/戌寅子丑。书：看这个命的职业，主要看印星。月柱食坐了印，印星寅与食神戌土拱了火，火主文化，食神为文化部门，戌也为文化部门，故他在文化机构工作，实际是个教师。但他不想干老师，总想当公务员，因坐下官不做功（但主位的子被丑合，无功，无官当），火土伤官不做功，火土食神做功，子丑虽合，但不是一家。这种组合就是老师。坐下官星合丑，不喜欢做老师，喜欢当官，但子丑合不做功。"
- id: zj-工薪无官
  name: zj-制官有工作不当官
  bazi:
    year: 壬子
    month: 丁未
    day: 癸亥
    hour: 乙卯
  gender: 乾
  verdicts:
    官命: "否·制官只表示有工作不表示当官"
    职业: "工薪族"
  source: zhongji:3580
  raw_quote: "乾：壬丁癸乙/子未亥卯。书：此造亥卯未合成食神局，水木成势，制局中未土为功，但这种制法效率较低，制官只表示有工作，不表示当官。食神星为其工资收入，而丁火财星可以表示工资外收入。壬午年，丁壬合，此年得工资外收入二万元。"
- id: gj-刘晓庆
  name: gj-刘晓庆影星
  bazi:
    year: 乙未
    month: 丙戌
    day: 甲子
    hour: 甲子
  gender: 坤
  verdicts:
    职业: "演员·著名影星"
  source: gaoji:1610
  raw_quote: "案例二（伤官泄秀，演艺明星）：坤造乙未丙戌甲子甲子（刘晓庆造）。格局：甲木日主，地支子水双印生身，年支未土为根，时干甲木比肩，身旺。月干丙火食神透出泄秀…效率：木火通明，食神泄秀生财。丙火为表演、光芒之象。层次：食神泄秀成格，且火旺，主名气。实际为著名影星，名利双收。"
- id: gj-影星合杀
  name: gj-合虚财影星
  bazi:
    year: 丙申
    month: 辛卯
    day: 乙巳
    hour: 丁亥
  gender: 坤
  verdicts:
    职业: "演员·著名影星"
  source: gaoji:1981
  raw_quote: "案例五（合虚财，才华取财）：坤造丙申辛卯乙巳丁亥。格局：乙木日主，月令卯木为禄，时支亥水印星，身旺。年干丙火伤官、时干丁火食神，泄秀生财。月干辛金七杀虚透，被丙火合制（丙辛合）…层次：合虚财（杀），配合食伤泄秀，为文化名人、艺术家之象。实际为著名影星。"
- id: gj-警察墓库
  name: gj-墓官杀警察
  bazi:
    year: 癸丑
    month: 乙丑
    day: 庚申
    hour: 庚辰
  gender: 坤
  verdicts:
    职业: "公检法·警察"
  source: gaoji:2401
  raw_quote: "案例三（墓官杀，公安执法）：坤造癸丑乙丑庚申庚辰。格局：庚金日主，月时两庚比肩。年月双丑土为正印库…日支申金禄神。时支辰土水库。实际此造，双丑土印库入时支辰土水库。丑为阴土，辰为阳土。阳库（辰）收阴库（丑），有制阴得阳之象。层次：墓用结构，阳库制阴库。实际为警察。后于己丑运，丑到墓到…庚寅年庚金绝地，肺病（庚申）墓绝同见而亡。"
