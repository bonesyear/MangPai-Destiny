  source: zhongji:4077
  raw_quote: "此造主位的印去制宾位的寅木，印为权力在主位，此人是银行副处级干部。…印戴官帽，甲己合去了官帽子为把官帽子摘了，甲辰运甲申年丢官。"
- id: reg67-建筑设计
  name: reg67-建筑设计
  bazi:
    year: 壬子
    month: 癸丑
    day: 丙寅
    hour: 戊戌
  gender: 男
  verdicts:
