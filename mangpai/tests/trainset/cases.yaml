  source: lixiangxue:6287-6297
  raw_quote: "她适合管理餐饮。事实上是一家大酒店的主管。命局虽有两层功，但所管理酒店是别人的资产…她本人的财富只是靠相生所得，赚取高工资而已。"
- id: reg67-服装
  name: reg67-服装
  bazi:
    year: 癸卯
    month: 丁巳
    day: 癸丑
    hour: 癸亥
  gender: 女
  verdicts:
