    职业: "军官"
  source: lixiangxue:3137
  raw_quote: "寅卯入未墓（多而墓之），未为七杀之墓，就是权力中心之意，而未土在四柱中又是羊刃，羊刃又有军队的意思，说明他是个军官。未入辰墓，自己控制着军队。实际正是，此人是军中师级干部。"
- id: reg67-制例二
  name: reg67-制例二
  bazi:
    year: 丙午
    month: 辛丑
    day: 戊寅
    hour: 壬戌
  gender: 女
  verdicts:
    财命: "富·数千万"
    职业: "国际贸易"
  source: lixiangxue:6594
  raw_quote: "此造地支寅午戌合成火局，制月令辛丑。丙辛合制，三合局之中神又在宾位，制伤官之力主要来自于宾位，虽也是富命，但远不如前者。搞国际贸易发家，数千万资产。"
- id: reg67-劫刃制官杀
  name: reg67-劫刃制官杀
  bazi:
    year: 甲申
    month: 丁卯
    day: 甲申
    hour: 甲子
  gender: 男
  verdicts:
    官命: "是·公安系统"
    职业: "公安"
  source: zhongji:3833
  raw_quote: "甲木日主坐七杀，卯申合，合了羊刃，七杀做了功制了羊刃。七杀主聪明才智，七杀合羊刃为公安系统，申金在坐下，是腰上挎枪之意。羊刃主枪，申金为屁股，相合所以为带枪的。老婆儿子都是做公安的。"
- id: reg67-化例一
  name: reg67-化例一
  bazi:
    year: 壬寅
    month: 丙午
    day: 戊寅
    hour: 乙卯
  dayun: 庚戌
  gender: 男
  verdicts:
    官命: "是·当官的命"
    应期: "戌运丢官失职下海经商"
  source: lixiangxue:6625
  raw_quote: "此造官杀比较重，月令丙午这一柱贴身，泄官杀生自己，化七杀为我所用，所以是个当官的命。…戌运印星入墓，丢官失职，下海经商。"
- id: reg67-化例二
  name: reg67-化例二
  bazi:
    year: 戊申
    month: 壬戌
    day: 丙寅
    hour: 壬辰
  dayun: 丙寅
  gender: 男
  verdicts:
    官命: "是·国营企业董事长"
    职业: "企业家·国营企业"
    应期: "丙寅大运升职"
  source: lixiangxue:6650
  raw_quote: "此造时逢旺杀，坐下寅木印星能化杀生身，但遇年上财星冲坏印星，虽有公职，但不是公务员，是一家国营企业董事长。行丙寅大运，升职。"
- id: reg67-博士
  name: reg67-博士
  bazi:
    year: 甲寅
    month: 甲戌
    day: 辛亥
    hour: 甲午
  gender: 男
  verdicts:
    学历: "高·数学博士"
  source: zhongji:5572
  raw_quote: "这个八字的功主要是杀星成局，合制伤官。伤官主头脑，智力，合杀而有用，故能成材。读至博士学位。…戍为数学，亥为数字，是故为数学博士。"
- id: reg67-印制伤食市长
  name: reg67-印制伤食市长
  bazi:
    year: 乙未
    month: 丁亥
    day: 甲午
    hour: 丙子
  gender: 男
  verdicts:
    官命: "是·市长"
    职业: "官员·市长"
  source: lixiangxue:7395
  raw_quote: "此造木火有势，日时子午冲，为伤官星制印。四柱无官，印主权力，所以此造是个官员，中年行南方火运，能制印星，升任市长。"
- id: reg67-受贿
