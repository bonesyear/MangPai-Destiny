    应期: "行至水运富有千万"
  source: lixiangxue:6379
  raw_quote: "此造坐下官星，被子水伤官所制…如运行得好，有两层功量，行至水运，富有千万。"
- id: reg67-普例5酒店主管
  name: reg67-普例5酒店主管
  bazi:
    year: 壬子
    month: 甲辰
    day: 庚寅
    hour: 己卯
  gender: 女
  verdicts:
