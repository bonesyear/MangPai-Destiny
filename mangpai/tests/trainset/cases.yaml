  raw_quote: "乾造：乙己已庚\n\n                已丑未午\n\n          大运：3戊13辛23丙33乙43甲53癸63壬\n\n                 子    亥   戌   酉   申\
    \   未   午\n\n          师伯断；“这是个富贵命，富大于贵。”我问：“能有多富？”答：“他今年37岁，我看已经是富过千万了。”我说：“此人比37大6O岁，已经不在人世了，这个八字用神是什么？”答：“已经不在人世的话我就敢说了，这个八字有个大毛病，我看他的儿了会凶死。他行水运、申字运与午字运都不好。”我说；“你讲的对，你看他儿子是早夭还成人后死的，为何说水运、申运与午运不好？”答：“他儿子是成人成事后突然凶死的，命中先大注定，决不会早夭，依找看会死于午运。至于说水运与甲运不好的理由金阳肯定教过你，我不说你也应知道。”我说：“金阳师父曾给我讲过禄神怕见财星，这个八字是不是这样的？”师伯说：“对，是这个意思。”随后我便将船王的经历大略说给师伯听。\n\
    \n         “此人为一大富翁，他的财产差不多有半个山西那么多。父亲为商人，行丁亥运是曾沦落为难民：在丙戌运中发迹；乙酉运中大发战争横财，资产逾过百亿；甲申运曾受人陷害，还在癸已年打官司，一次损失10亿美元；癸未运建成自己庞大的船队，成为世界首级富翁；行入壬午运，在壬子年其唯一的儿子因飞机失事遇难，晚年丧子的打击使他的精神彻底跨了，三年后的乙卯年自己也得病离开人世。”\n\
    \n           我们对盲师传的口诀“禄神怕财”之类的东西并不十分的理解，口诀只适合他们用，我们实在没有能力记住那么多东西，我们只能把这些东西归纳成某种理。象这个命就是贼神结构的命。命中已土旺而从强，丑中辛金癸水与庚金全是忌神。命中丑未冲，丑中辛金忌神被去，癸水也被去。被去的忌神辛与癸为贼神。但庚透干，逢乙庆合未去，故最大的毛病在庚金，虽言忌神虚透为吉，但未被去却为命中一患。伤官食神在这里都是财，故此人能为巨富。行水运不利用神火（此造还因时支得禄，以禄当财为贵），不吉；到丙戌运成再刑丑，丙又去庚，大吉。乙酉运贼神到位被制，是他一生最好的大运；到"
