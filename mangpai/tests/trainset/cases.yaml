    职业: "官员·管理大电厂"
  source: lixiangxue:6961
  raw_quote: "丑是财库，两酉入库，不为拱局，是墓用结构，意思是自己控制着很大的财产。…实际他是个官员，管理很大的电厂。"
- id: reg67-曾国藩乙未
