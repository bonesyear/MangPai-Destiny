  raw_quote: "此造时逢旺杀，坐下寅木印星能化杀生身，但遇年上财星冲坏印星，虽有公职，但不是公务员，是一家国营企业董事长。行丙寅大运，升职。"
- id: reg67-博士
  name: reg67-博士
