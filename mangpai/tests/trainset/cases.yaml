    month: 丁卯
    day: 甲申
    hour: 甲子
  gender: 男
  verdicts:
    官命: "是·公安系统"
    职业: "公安"
  source: zhongji:3833
  raw_quote: "甲木日主坐七杀，卯申合，合了羊刃，七杀做了功制了羊刃。七杀主聪明才智，七杀合羊刃为公安系统，申金在坐下，是腰上挎枪之意。羊刃主枪，申金为屁股，相合所以为带枪的。老婆儿子都是做公安的。"
- id: reg67-化例一
