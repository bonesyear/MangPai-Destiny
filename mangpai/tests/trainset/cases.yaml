  raw_quote: "乾：  壬壬庚辛\n\n          子寅辰已\n\n    郝先生断：公检法的官。戊寅年实现带有肩章的官，用神巳火特喜寅木穿动生已，若卯木生巳火时则无动的含意。\n\n    寅木生丙丁都强，尤为丙火，相当旺。卯木生丙火不强。\n\
    \n    巳火遇土：（晦火）\n\n    辰：湿，不克水。                  戍：燥，克水，也晦火。\n\n    丑：湿，不克水，丑土比辰土湿度强。未：燥，吸水力强，也晦火。\n\n    戌土火旺，午火生戌土土力更强。\n\
    \n    丙火坐午比丁火坐巳强，因午火为帝旺。\n\n    辰、丑帮土力不大。\n\n    戌末帮戊己土力强。\n\n    例11"
