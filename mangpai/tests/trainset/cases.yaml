  gender: 男
  verdicts:
    官命: 是·半壁天下
    职业: 军阀·武职
  source: shouke-ans12:2542;zhenbao-qi02:421
  raw_quote: "阎锡山：       癸辛乙丁\n\n                     未酉酉丑\n\n        大运：     庚己戊丁丙乙甲\n\n                    申未午已辰卯寅\n\n \
    \       《滴入髓》曰：乙木秋生如木同桂，怀丁抱丙可跨凤乘猴。故秋生之乙木不慎金吐，相反金旺见火可成大贵。为什么会有这种特点，我思考乙木为禾稼，到秋天为收获的季节，金旺克木正好如同成熟的庄稼需收割一样。收回的粮食最喜见火，即晾晒之意。最怕见水，粮食必发霉变质。十干之理通于常理。\n\
    \n      命理之理法很多，我们前边讲过八字中弱的忌神用旺的用神去之则吉，还有相反的理也是正确\n\n的：即八字中有旺的忌神，用弱的用神制则也吉。后一种理留作我们以后再详尽探讨，阎命就属于后一种理的典型代表。\n\n      七杀为小人为恶人为官害，今阎命用一点食神制之，即表示恶人能为我所用，统治群僚。食神主思想、头脑、谋略，这符合阎的统治方式。阎最讲平衡政治，讲“中的哲学”，说自己在“三个鸡蛋上跳舞”（即与蒋介石、共产党、日本人之间搞平衡），他深知“七杀”的厉害，故用弱食神去平衡从杀。刘开成先生告他“要当呆子，不要当精子，”即以退为进，众杀自然驯服。可他还是忘记了先生的话，丁巳大运庚午流年，挑起中原大战，结果惨败告终，权力尽夫。多亏他有平衡的艺术，后又获得权力。庚午流年用神最旺，即他最得意之年，经济实力雄厚，自以为可与者蒋抗衡，殊不知旺火必激怒旺金，金火相较力很难言胜，况已运已酉丑合金局，象征张学良倒向蒋的一边，必败无疑。故而可知，旺的忌神所需是弱制则成，旺制反凶。"
