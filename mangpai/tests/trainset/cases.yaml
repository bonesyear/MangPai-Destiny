    职业: "工人·煤矿工人体力取财"
  source: gaoji:1109
  raw_quote: "案例三（比劫制财，体力取财）：乾造乙酉乙酉戊寅乙卯。格局：官杀重重克身，财星藏于杀中。日主戊土微弱，全赖年时远隔之比劫（土）助身抗杀…层次：比劫制财不成，反为财官所累。实际为煤矿工人，体力取财，贫贱之命。（异文备案：高级10490案例十同一人作乙丑年：乾造乙丑乙酉戊寅乙卯，实际为煤矿工人，丑为阴湿金石之库类象煤窑。）"
- id: gj-泄身艺匠
