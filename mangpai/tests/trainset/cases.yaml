  raw_quote: "乾造：壬癸壬甲\n\n               子卯子辰\n\n         此人专程到红表找先生算命，先生头一句话是：“你的婚姻不太顺，大姑娘（土话指初婚女）你找不成，撑死你找个退婚的，多半你找了个二婚的。”\n\
    \n        实际此人娶了个大他许多岁，前夫判刑坐牢后离异的女人。\n\n       来了许多解答，没有一个完全答对的。解这人命有两个要点，其一，此造不以财星为妻，而以伤官卯水这妻；其二，卯木盖头劫财这是其中一条理由，更主要的是卯木被两子破，卯木先被年上子破，然后才让口主自己破，故找的妻是破货。\n\
    \n        真传一句话，假传万卷书。其实破的用法非常之多，只要你留意就会发现它的妙用。"
