    职业: "房地产"
  source: lixiangxue:6807
  raw_quote: "此造壬申日，合丁未财星，身强财也旺，财星合身，是为富命，从事房地产开发，发财数千万元。"
- id: reg67-合例八暗合
  name: reg67-合例八暗合
  bazi:
    year: 丙申
    month: 甲午
    day: 乙卯
    hour: 甲申
  gender: 男
  verdicts:
    官命: "是·最高人民法院副院长"
    职业: "官员·法院"
  source: lixiangxue:6909;zhongji:3701
  raw_quote: "年上申金被丙午火围制，伤官制官为功。被制的官星合到主位，所以是个当官命。／此人乙木坐禄合时上正官，原局没有七杀混杂，所以官职高。…此人是最高人民法院副院长。"
- id: reg67-合例六两妻
  name: reg67-合例六两妻
  bazi:
    year: 己酉
    month: 丁卯
    day: 庚戌
    hour: 己卯
  gender: 男
  verdicts:
    财命: "富"
    婚姻: "差·两个老婆同时存在"
  source: lixiangxue:6873
  raw_quote: "日支合财，两个财往身上合，富的意思。这个命还有个特点：有两个老婆，两个财都合妻宫，这两个老婆同时存在。其中一个老婆是月令卯，是他的同学，而且是离过婚的，因为有卯酉冲，离婚后跟他一起过。"
- id: reg67-墓例一经理
  name: reg67-墓例一经理
  bazi:
