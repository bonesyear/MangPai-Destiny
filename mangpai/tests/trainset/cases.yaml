  raw_quote: "乾造：甲寅、癸酉、丁丑、庚子。这个命在丙子运的戊寅、己卯、庚辰流年破财不好，到辛已年不破财了（所断完全正确）；只有到了丁丑运才能好起来。还说这个八字用神是辛金与酉金，不用庚金，请学员解释一下为什么？\n\n    答：此八字为从财格，用神是财与伤食，忌神是印星与它杀。但八字原局庚金坐子，故庚金无用，反生水为忌。故用辛与酉不用庚。戊寅己卯印星流年不吉，庚辰年，庚不喜，辰与酉合还绊了酉，破财不少。\n\
    \n                          第三十五期作业答案"
