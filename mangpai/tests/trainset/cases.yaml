  raw_quote: 又断那一定当过兵，对方说是当过兵。我说，那他应该是银行的官员，这下对了。 / 赵宇分析一会断：这个命癸未运走坏了，反了局，2008戊子年一定遇到大麻烦，子卯相破，杀星被破，整个局反了。癸水财星代表丑土跑了，犯了经济问题，不是个丢官罢职的事，应该有牢狱之灾！ / 赵宇答：这个命估计要判十年，快也有六七年的牢灾，经济问题，但不会判死刑，过了癸未运，这家伙还有一步好运，估计会发大财。 / 癸水的数，六数，不是六百万就是六千万。贪污就是六百万，挪用公款就是六千万。果真，六千万的案，挪用公款。（运岁：大运：09庚辰 19辛巳 29壬午 39癸未 49甲申；癸未运2008戊子年牢狱）（注：断例几则之银行官员；OCR“已 已壬”月日两干为“己”之误）
