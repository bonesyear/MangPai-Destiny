    婚姻: "差·单身命至今未谈过对象"
  source: zhongji:3631;zhongji:5061
  raw_quote: "坤：丁壬庚壬/未寅子午。书：食伤生财，财星入印墓在宾位，是替别人做智力服务的，所以也是个工薪族，只是收入较高。行巳运，穿倒寅木，收入不高，原来工作的单位破产；行丙午运，被聘到私营企业，收入很高。（…丙午运被聘到私企做注册会计师，月薪很高，4、5千元。食生财，财入墓，做帐的。）（中级3631）中级5061同盘：是夫宫伤官星欲制夫星之官，但局中官旺反将夫宫子水坏掉（子未穿了），所以是单身命。因相貌难看，无人喜爱，至今未谈过对象。"
- id: gj-合财反贫
  name: gj-身弱财旺合财反贫
  bazi:
