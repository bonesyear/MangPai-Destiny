  source: lixiangxue:6788;zhongji:3701
  raw_quote: "年上申金被丙午火围制，伤官制官为功。被制的官星合到主位，所以是个当官命。／此人乙木坐禄合时上正官，原局没有七杀混杂，所以官职高。…此人是最高人民法院副院长。"
- id: reg67-合例六两妻
