    财命: "贫·一生贫苦多灾多难"
  source: gaoji:1928
  raw_quote: "案例二（身弱财旺，合财反贫）：乾造甲寅丁卯戊辰癸丑。格局：戊土日主，生于卯月，官星当令。地支寅卯辰会东方木局，官杀极旺克身…层次：身弱不胜财官，合财反致祸患。实际一生贫苦，多灾多难，因小财惹大麻烦。此为败格典型。"
- id: gj-煤矿工人
