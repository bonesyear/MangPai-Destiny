    职业: "酒店主管·管理餐饮"
  source: lixiangxue:6400
  raw_quote: "她适合管理餐饮。事实上是一家大酒店的主管。命局虽有两层功，但所管理酒店是别人的资产…她本人的财富只是靠相生所得，赚取高工资而已。"
- id: reg67-服装
  name: reg67-服装
  bazi:
    year: 癸卯
    month: 丁巳
    day: 癸丑
    hour: 癸亥
  gender: 女
  verdicts:
    职业: "服装生意·开门店"
  source: lixiangxue:3432
  raw_quote: "此造是做服装生意的，开有几个门店。从命局中看，卯木生巳火成财，卯为织物，卯生巳，其象为织物加工成漂亮的服装，巳亥冲，也主交易，以此取财。"
- id: reg67-比劫包局争夫
  name: reg67-比劫包局争夫
  bazi:
    year: 庚戌
    month: 乙酉
    day: 庚申
    hour: 乙酉
  gender: 女
  verdicts:
    婚姻: "差·争夫难成婚"
  source: gaoji:9655
  raw_quote: "比劫包局夹夫妻宫，如同丈夫（官星）被一群女人（比劫）包围、争夺。婚姻必然痛苦不堪，竞争激烈，难以稳定。实际命主婚姻极其不顺，多次恋爱均被他人横刀夺爱，至今难成婚。"
- id: reg67-生例一富婆
  name: reg67-生例一富婆
  bazi:
    year: 辛亥
    month: 庚子
    day: 庚寅
    hour: 己卯
  gender: 女
  verdicts:
    财命: "富·富有千万"
    应期: "甲运移民外国"
  source: lixiangxue:6682
  raw_quote: "此造主位临财，宾位伤官、食神，宾来生主，财源不绝。故为富婆命，行至财运，与夫创业发迹，富有千万。甲运合己，合到门户，移民外国。"
- id: reg67-生例二经理
  name: reg67-生例二经理
  bazi:
    year: 癸巳
    month: 甲子
    day: 癸卯
    hour: 癸亥
  gender: 女
  verdicts:
    职业: "经理·国有商业企业"
  source: lixiangxue:6692
  raw_quote: "虽然是替公家做事，但自己有职务，曾任一家国有商业企业经理。"
- id: reg67-甲子地矿局长
  name: reg67-甲子地矿局长
  bazi:
    year: 癸巳
    month: 甲子
    day: 戊午
    hour: 癸亥
  dayun: 庚申
  gender: 男
  verdicts:
    官命: "是·县地矿局局长"
    职业: "官员·地矿局"
    应期: "庚申运掌财权/己运免职"
  source: zhongji:2494
  raw_quote: "月令的财很大，午亥合，制了主位的印，是管财的官，是县地矿局局长，庚申运当的…己运甲己合，己是劫，又旺，一合，被免职了，官被别人当了。"
- id: reg67-申机器工人
  name: reg67-申机器工人
  bazi:
    year: 辛卯
    month: 丙申
    day: 辛巳
    hour: 丙申
  dayun: 壬辰
  liunian: 癸酉
  gender: 男
  verdicts:
    官命: "否·命平常不贵"
    职业: "工人·管机器运转"
    应期: "癸酉年下岗/戊寅年上岗"
  source: zhongji:1257;2203
  raw_quote: "此造是合用官星，但官星无力又被他合，故命平常不贵。…到壬辰运之癸酉流年…财与工作都没有了，故此年下岗在家。…在戊寅年上岗，重新有了工作。／他是个管机器运转的人，这么一想，就明白他是个工人。实际正是。"
- id: reg67-癸巳管财官
  name: reg67-癸巳管财官
  bazi:
    year: 辛丑
    month: 辛卯
    day: 丙寅
    hour: 癸巳
  dayun: 丁亥
  liunian: 戊寅
  gender: 男
