  raw_quote: "坤：乙乙丙庚（邢铭芬）/未酉戌寅。夏老断：是个老师（注：寅戌拱了火），但无文化。乙庚合，印变成了财…壬午（壬水虚透了）年要出大名，婚姻坏了。壬午不自合，丙壬一冲，动了，但穿了财，故发不了大财，只能发点小财。如是丁酉日主见了戌则是得财之命。酉表玄学，穿了主位，表示命学水平不行，火主神经，火太旺了，故神经质，神经有问题。"
- id: zj-图书管理员
  name: zj-图书管理员工薪
  bazi:
    year: 庚申
    month: 己卯
    day: 乙酉
    hour: 庚辰
  gender: 坤
  verdicts:
    财命: "平·工薪族挣工资不能大富"
    职业: "文化·学校图书管理员"
    婚姻: "差·婚姻不好"
  source: zhongji:3603
  raw_quote: "坤：庚己乙庚/申卯酉辰。书：此造主位占财官，乙庚合，合官带财，官为工作，财为工资，故是个工薪族。或问，八字有土金之势制卯木，为何不是大富贵之命？因卯木禄神在这里是女人的肉体，用此做功当然不能大富…（婚姻不好，卯禄又冲又合…她本人是学校图书管理员。）"
- id: gj-合财小康
  name: gj-身旺财弱合财小康
  bazi:
    year: 癸巳
    month: 甲子
    day: 丁酉
    hour: 庚子
  gender: 乾
  verdicts:
    财命: "小康·工薪族收入稳定生活小康"
    职业: "工薪族·一技之长"
  source: gaoji:1937
  raw_quote: "案例三（身旺财弱，合财小康）：乾造癸巳甲子丁酉庚子。格局：丁火日主，年支巳火为根，月干甲木正印生身，身不弱。时干庚金正财虚透，合日主丁火…层次：合财格成，但财弱，故不发大财。实际为有一技之长的工薪族，收入稳定，生活小康。"
- id: zj-注册会计师
