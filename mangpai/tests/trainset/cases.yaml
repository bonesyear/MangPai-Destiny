  raw_quote: 这种生意我们村很多人做，就是开三轮车带一些铝制品到外地卖。几年下来，争不仅没赚到钱，还亏了很多。 / 郝师给他断到：你这个命，这几年得有饥荒了（负债之意），你累死累活不算数，饥荒得够五万，现在够不够？答：现在够五万了 / 再欠还是要欠的，不过以后欠的是喜饥荒，不是坏饥荒，不是起房子，就是要娶媳妇。后来，果真再没有在生意上赔钱了，不久，儿子娶了媳妇，从此家运才慢慢好转起来。（注：命运谈屑篇村民高某（五十多岁，男性），1998年找郝师预测；无乾坤标注）
