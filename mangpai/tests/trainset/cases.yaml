  raw_quote: "此造寅为印是工作，寅又是公门、机关，故可断为公务员；戊戌为食神，有思想之意，戊戌又有建筑的含义，可表示建筑设计，故他是个国家公务员，从事建筑设计。"
- id: reg67-普例1普通人
  name: reg67-普例1普通人
  bazi:
    year: 丙戌
    month: 戊戌
    day: 辛巳
    hour: 癸巳
  gender: 男
  verdicts:
    官命: "否·普通人"
  source: lixiangxue:6340
  raw_quote: "此造有火与燥土之势，势实在太大，但所做的功仅仅是制时干之癸水。所幸有巳入戌墓之功，能有工作单位，难以成大贵。虽谈吐风雅，但也只是个普通人。"
- id: reg67-普例2小职权
  name: reg67-普例2小职权
  bazi:
    year: 壬子
    month: 己酉
    day: 乙丑
    hour: 丁丑
  gender: 女
  verdicts:
    官命: "是·小职权"
  source: lixiangxue:6352
  raw_quote: "再看主位丑土与七杀酉金相拱，成三合局之半局，其表达的意思是自己要入官场，是辅佐他人之职。这也是做功，是相生之功，但功不算大，故能有小职权。"
- id: reg67-普例3收入较高
  name: reg67-普例3收入较高
  bazi:
    year: 庚戌
    month: 庚辰
    day: 癸未
    hour: 丁巳
  gender: 男
  verdicts:
    财命: "小康·收入较高"
  source: lixiangxue:6365
  raw_quote: "专看日支未土，未土受时上财星之生，意思是外边的财要生到他家里，故是个有钱的命。但这种相生效率都比较低，故是个普通人，收入较高而已。"
- id: reg67-普例4千万
