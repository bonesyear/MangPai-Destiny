  source: lixiangxue:6937
  raw_quote: "所以此命有两个不同的功，也主两个不同的职业。命主行食神运当老师十余年，行庚申财运下海经商，应巳申之合取财，发财数百万。"
- id: reg67-外贸商
  name: reg67-外贸商
  bazi:
    year: 壬子
    month: 丙午
    day: 己巳
    hour: 辛未
  gender: 女
  verdicts:
    财命: "富·发财千万"
    职业: "贸易·海外贸易"
  source: lixiangxue:2683;7484
  raw_quote: "原局子午相冲，财星冲禄，这个冲可以表示财物交换，故她是个做贸易的。／此造是火土之势，去壬子水财星，印旺去财，功很大，是为富命。做海外贸易，发财千万。"
- id: reg67-官杀当财
  name: reg67-官杀当财
  bazi:
    year: 辛卯
    month: 庚子
    day: 丙申
    hour: 丁酉
  dayun: 未
  gender: 男
  verdicts:
    财命: "富·数百万"
    应期: "未运发财数百万"
  source: lixiangxue:2564
  raw_quote: "申子半合水局，局中金之气归于水，子水为官星，在这里表示财富。行未运，穿制子水，发财数百万。"
- id: reg67-寅卯借妻宫
