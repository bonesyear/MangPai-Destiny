    职业: "国际贸易"
  source: lixiangxue:6482-6486
  raw_quote: "此造地支寅午戌合成火局，制月令辛丑。丙辛合制，三合局之中神又在宾位，制伤官之力主要来自于宾位，虽也是富命，但远不如前者。搞国际贸易发家，数千万资产。"
- id: reg67-劫刃制官杀
