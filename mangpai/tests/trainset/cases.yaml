  bazi:
    year: 庚寅
    month: 己丑
    day: 丁卯
    hour: 癸卯
  liunian: 甲戌
  gender: 男
  verdicts:
    婚姻: "差·两次婚姻第一个妻被杀"
    应期: "甲戌年死妻"
  source: zhongji:2615
  raw_quote: "此造卯为妻宫，寅与卯同样的五行属性，那寅也为妻宫，这样庚金就是妻星，八字中出现多个妻宫与妻星，就是有好几次婚姻。此造第一个妻死，后再娶。…两次婚姻…甲戌年死妻，被杀。"
- id: reg67-带帽银行副处
