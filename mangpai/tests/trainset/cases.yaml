  raw_quote: "例；庚戊壬庚      大运：己庚辛壬\n\n             戌子午子            丑寅卯辰\n\n        99年时此人问郝先生流年如何，郝断：“今年你有一场官司要打，官司要输，要大破财。”来人说：“先生真是神断，我的官司一审已经输了，己经破得我快清家荡产了，人家对方法院里有人，我是被人家给黑了，先生看我的官司能否翻案？何时翻案？”郝答：“你要上诉，明年会有转机，有贵人出来帮你，要能坚持到后年话，你的官司就会赢了。”\n\
    \n        结果一审败了后，今年一位朋友帮忙，找到地委书记，地委书记写了个条给地区法院，地区法院将县法院的裁定驳回重审（已驳回去两次），县法院无法结案。这时对方难受了，主动出面要与他和解,被他拒绝。看来明年的官司是赢定了。\n\n\
    \         郝先生神奇的断语说起来非常简单，辛卯运己卯年，卯刑子主官司，卯破午主破财。他的八字用神是火，卯木小生午火还破火，故会破财。庚辰年卯木又被辰土穿坏，卯失去作用，会有转机；而原来被卯木绊着的戌土也被释放，戌土克制羊刃忌神，故出现了贵人帮忙。\n\
    \n        《卜文命学电子版》登了郝先生曾断过的一造："
