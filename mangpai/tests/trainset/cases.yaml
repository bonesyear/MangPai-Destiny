  source: zhongji:5797
  raw_quote: "七杀无制就是一种犯罪结构，又坐财库，有牢狱之灾的象征。…此人是温岭市政府办公室主任，因受贿42万元于癸未年入狱判9年。"
- id: reg67-合例一富命
