    hour: 庚子
  gender: 男
  verdicts:
    职业: "经理·企业经理人"
  source: lixiangxue:6926
  raw_quote: "寅木食神墓于未，寅是他主位的食神，表示他本人的才华，入于官墓，说明他的才华被官方所用，寅为内食神，主企业，所以他是个企业的经理人。"
- id: reg67-墓例三电厂官
  name: reg67-墓例三电厂官
  bazi:
