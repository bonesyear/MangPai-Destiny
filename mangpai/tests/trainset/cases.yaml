  raw_quote: "乾造：壬癸壬壬\n\n               寅卯子寅\n\n         行丙午运成为我市最年轻的国有大型企业的董事长，实际上也是从了内食神。因八字无明购，食神中的财以才华看，不主财富，丙午运贴现，其才华得到充分体现。卯木伤官混局为病，断申运去伤官而动食神大好。这种格局只要身不太强无印或有印被环就能成。\n\
    \n         推而广之，十神的内外都有不同的内涵。大家心里先有这样一个概念，以后我们会逐步讲到这方面的问题。\n\n         （这是前半年最后一期，根据大家反馈的情况，后半年我将以讲解实例为主，同时要比较系统地讲一些专题。通过这二十六期，八字中最基本的要点和核心已基本全讲到了，剩下的就是提高大家的实测能力了。）"
