name: credentials

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/check_credentials.py --all

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest pyyaml sxtwl
      - run: python -m pytest mangpai/tests -q
      - run: python scripts/check_layering.py
      - run: python scripts/check_typing_imports.py
      - run: python scripts/check_doc_links.py
      - run: python scripts/check_doc_numbers.py --quiet
